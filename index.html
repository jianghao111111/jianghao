<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蒋昊 - 个人主页</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS RESET & BASE ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Noto Sans SC', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ===== PARTICLE CANVAS ===== */
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== SCAN LINE OVERLAY ===== */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 240, 255, 0.015) 2px,
                rgba(0, 240, 255, 0.015) 4px
            );
        }

        /* ===== MAIN CONTENT WRAPPER ===== */
        .content-wrapper {
            position: relative;
            z-index: 2;
            padding: 0 120px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== SIDE BUTTONS ===== */
        .side-buttons {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .side-buttons--left { left: 16px; }
        .side-buttons--right { right: 16px; }

        .side-btn {
            width: 44px; height: 44px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: #00f0ff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .side-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0,240,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .side-btn:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            transform: scale(1.1);
        }
        .side-btn:hover::before { opacity: 1; }

        .side-btn .tooltip {
            position: absolute;
            white-space: nowrap;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            font-size: 12px;
            color: #00f0ff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
        }
        .side-buttons--left .side-btn .tooltip { left: 56px; transform: translateX(-10px); }
        .side-buttons--right .side-btn .tooltip { right: 56px; transform: translateX(10px); }
        .side-btn:hover .tooltip { opacity: 1; transform: translateX(0); }

        .side-btn--purple { border-color: rgba(180, 0, 255, 0.3); color: #b400ff; }
        .side-btn--purple:hover { border-color: #b400ff; box-shadow: 0 0 20px rgba(180, 0, 255, 0.3); }
        .side-btn--pink { border-color: rgba(255, 0, 110, 0.3); color: #ff006e; }
        .side-btn--pink:hover { border-color: #ff006e; box-shadow: 0 0 20px rgba(255, 0, 110, 0.3); }

        /* ===== HERO SECTION ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 0;
        }

        .hero-glow {
            position: absolute;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.08) 0%, transparent 70%);
            filter: blur(60px);
            animation: pulse-glow 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .hero-name {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(48px, 8vw, 96px);
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #00f0ff, #b400ff, #ff006e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s ease infinite;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero-subtitle {
            font-size: clamp(14px, 2vw, 20px);
            color: rgba(255, 255, 255, 0.6);
            margin-top: 20px;
            letter-spacing: 4px;
            font-weight: 300;
            min-height: 30px;
        }
        .hero-subtitle .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #00f0ff;
            margin-left: 4px;
            animation: blink 1s infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .hero-tagline {
            margin-top: 40px;
            font-size: 16px;
            color: rgba(0, 240, 255, 0.5);
            letter-spacing: 2px;
            animation: fade-in 2s ease 1.5s both;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
        }
        .scroll-indicator span {
            display: block;
            width: 2px;
            height: 40px;
            background: linear-gradient(to bottom, rgba(0,240,255,0.6), transparent);
            margin: 0 auto 8px;
        }
        .scroll-indicator p {
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 2px;
        }
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }

        /* ===== SECTION COMMON ===== */
        .section {
            padding: 80px 0;
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .section.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 700;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: 4px;
            position: relative;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #00f0ff, #b400ff);
            margin: 16px auto 0;
        }

        /* ===== HOBBIES SECTION ===== */
        .hobbies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .hobby-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 240, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .hobby-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(0,240,255,0.08) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .hobby-card:hover::before { opacity: 1; }
        .hobby-card:hover {
            border-color: rgba(0, 240, 255, 0.4);
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0, 240, 255, 0.1);
        }
        .hobby-icon {
            font-size: 56px;
            margin-bottom: 20px;
            display: block;
            transition: transform 0.4s;
        }
        .hobby-card:hover .hobby-icon { transform: scale(1.2) rotate(5deg); }
        .hobby-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #00f0ff;
        }
        .hobby-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.8;
        }

        /* ===== TRAITS SECTION ===== */
        .traits-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            max-width: 900px;
            margin: 0 auto;
        }
        .trait-tag {
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            border: 1px solid;
            animation: float-tag 6s ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            transition: all 0.3s;
            cursor: default;
        }
        .trait-tag:hover {
            transform: scale(1.1) !important;
            box-shadow: 0 0 30px var(--glow);
        }
        @keyframes float-tag {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .trait-cyan { border-color: rgba(0,240,255,0.3); color: #00f0ff; --glow: rgba(0,240,255,0.3); }
        .trait-purple { border-color: rgba(180,0,255,0.3); color: #b400ff; --glow: rgba(180,0,255,0.3); }
        .trait-pink { border-color: rgba(255,0,110,0.3); color: #ff006e; --glow: rgba(255,0,110,0.3); }
        .trait-green { border-color: rgba(0,255,136,0.3); color: #00ff88; --glow: rgba(0,255,136,0.3); }

        /* ===== BOMB SECTION ===== */
        .bomb-section {
            text-align: center;
            padding: 80px 0 120px;
        }
        .bomb-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            border-radius: 50px;
            border: 2px solid rgba(255, 0, 110, 0.5);
            background: rgba(255, 0, 110, 0.1);
            color: #ff006e;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Noto Sans SC', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
        }
        .bomb-btn:hover {
            background: rgba(255, 0, 110, 0.2);
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.4);
            transform: scale(1.05);
        }
        .bomb-btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(transparent, rgba(255,0,110,0.3), transparent 30%);
            animation: rotate-border 3s linear infinite;
        }
        .bomb-btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 48px;
            background: #000;
            z-index: 0;
        }
        .bomb-btn span, .bomb-btn .bomb-emoji {
            position: relative;
            z-index: 1;
        }
        @keyframes rotate-border {
            to { transform: rotate(360deg); }
        }

        /* ===== EXPLOSION OVERLAY ===== */
        .explosion-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            display: none;
        }
        .explosion-overlay.active {
            display: block;
            pointer-events: auto;
        }
        .explosion-flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
        }
        .explosion-flash.animate {
            animation: flash 0.6s ease-out forwards;
        }
        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .explosion-particle {
            position: absolute;
            width: 8px; height: 8px;
            border-radius: 50%;
        }
        .restore-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 50px;
            border-radius: 50px;
            border: 2px solid #00f0ff;
            background: rgba(0, 0, 0, 0.8);
            color: #00f0ff;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Noto Sans SC', sans-serif;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 10000;
            letter-spacing: 4px;
        }
        .restore-btn.visible { opacity: 1; }
        .restore-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
        }

        /* ===== TOAST NOTIFICATION ===== */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 14px 28px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            color: #00f0ff;
            font-size: 14px;
            z-index: 10001;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            max-width: 400px;
            text-align: center;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 768px) {
            .content-wrapper { padding: 0 20px; }
            .side-buttons--left, .side-buttons--right {
                position: fixed;
                top: auto;
                bottom: 80px;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: row;
            }
            .side-buttons--right { bottom: 140px; }
            .side-btn .tooltip { display: none; }
            .hobbies-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- PARTICLE CANVAS -->
    <canvas id="particles-canvas"></canvas>
    <!-- SCAN LINES -->
    <div class="scanlines"></div>

    <!-- SIDE BUTTONS LEFT -->
    <div class="side-buttons side-buttons--left">
        <button class="side-btn" onclick="sideAction('matrix')" aria-label="Matrix效果">
            <span>M</span>
            <div class="tooltip">切换粒子矩阵</div>
        </button>
        <button class="side-btn side-btn--purple" onclick="sideAction('quote')" aria-label="随机语录">
            <span>Q</span>
            <div class="tooltip">随机语录</div>
        </button>
        <button class="side-btn side-btn--pink" onclick="sideAction('color')" aria-label="切换主题色">
            <span>C</span>
            <div class="tooltip">切换主题色</div>
        </button>
    </div>

    <!-- SIDE BUTTONS RIGHT -->
    <div class="side-buttons side-buttons--right">
        <button class="side-btn" onclick="sideAction('speed')" aria-label="加速粒子">
            <span>⚡</span>
            <div class="tooltip">加速粒子</div>
        </button>
        <button class="side-btn side-btn--purple" onclick="sideAction('gravity')" aria-label="重力效果">
            <span>G</span>
            <div class="tooltip">重力效果</div>
        </button>
        <button class="side-btn side-btn--pink" onclick="sideAction('firework')" aria-label="放烟花">
            <span>🎆</span>
            <div class="tooltip">放烟花</div>
        </button>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- MAIN CONTENT -->
    <div class="content-wrapper" id="main-content">
        <!-- HERO -->
        <section class="hero">
            <div class="hero-glow"></div>
            <h1 class="hero-name">蒋 昊</h1>
            <p class="hero-subtitle"><span id="typewriter"></span><span class="cursor"></span></p>
            <p class="hero-tagline">// HELLO WORLD. WELCOME TO MY SPACE.</p>
            <div class="scroll-indicator">
                <span></span>
                <p>SCROLL</p>
            </div>
        </section>

        <!-- HOBBIES -->
        <section class="section" id="hobbies">
            <h2 class="section-title">我的爱好</h2>
            <div class="hobbies-grid">
                <div class="hobby-card">
                    <span class="hobby-icon">🎮</span>
                    <h3 class="hobby-name">GAMING</h3>
                    <p class="hobby-desc">沉浸虚拟世界，享受策略与操作的快感。从竞技到冒险，游戏是释放压力的最佳方式。</p>
                </div>
                <div class="hobby-card">
                    <span class="hobby-icon">🏸</span>
                    <h3 class="hobby-name">BADMINTON</h3>
                    <p class="hobby-desc">挥拍之间，感受速度与力量的碰撞。羽毛球让我保持活力，也教会我专注与坚持。</p>
                </div>
                <div class="hobby-card">
                    <span class="hobby-icon">🛼</span>
                    <h3 class="hobby-name">ROLLERBLADING</h3>
                    <p class="hobby-desc">脚下的轮子带我在城市穿梭，风从耳边掠过。轮滑不仅是运动，更是一种自由的态度。</p>
                </div>
            </div>
        </section>

        <!-- TRAITS -->
        <section class="section" id="traits">
            <h2 class="section-title">关于我</h2>
            <div class="traits-container" id="traits-container">
                <span class="trait-tag trait-cyan" style="--delay: 0s;">乐观热忱</span>
                <span class="trait-tag trait-purple" style="--delay: 0.5s;">元气随性</span>
                <span class="trait-tag trait-pink" style="--delay: 1s;">直率坦荡</span>
                <span class="trait-tag trait-green" style="--delay: 1.5s;">积极向上</span>
                <span class="trait-tag trait-cyan" style="--delay: 2s;">风趣随和</span>
                <span class="trait-tag trait-purple" style="--delay: 2.5s;">热爱生活</span>
                <span class="trait-tag trait-pink" style="--delay: 3s;">理智通透</span>
                <span class="trait-tag trait-green" style="--delay: 0.3s;">独立自主</span>
                <span class="trait-tag trait-cyan" style="--delay: 0.8s;">三观端正</span>
                <span class="trait-tag trait-purple" style="--delay: 1.3s;">思虑周全</span>
                <span class="trait-tag trait-pink" style="--delay: 1.8s;">严于律己</span>
                <span class="trait-tag trait-green" style="--delay: 2.3s;">从容淡定</span>
            </div>
        </section>

        <!-- BOMB -->
        <section class="bomb-section section">
            <button class="bomb-btn" onclick="triggerBomb()">
                <span class="bomb-emoji">💣</span>
                <span>引 爆 此 页 面</span>
            </button>
        </section>
    </div>

    <!-- EXPLOSION OVERLAY -->
    <div class="explosion-overlay" id="explosion-overlay">
        <div class="explosion-flash" id="explosion-flash"></div>
        <button class="restore-btn" id="restore-btn" onclick="restorePage()">🔄 复 原 页 面</button>
    </div>

    <script>
        /* ===== PARTICLE SYSTEM ===== */
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        let particles = [];
        let particleSpeed = 1;
        let gravityOn = false;
        let mouse = { x: -1000, y: -1000 };
        let themeColors = ['#00f0ff', '#b400ff', '#ff006e', '#00ff88'];
        let currentTheme = 0;
        let matrixMode = false;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        document.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Particle {
            constructor(x, y, isFirework = false) {
                this.x = x || Math.random() * W;
                this.y = y || Math.random() * H;
                this.baseVx = (Math.random() - 0.5) * 0.8;
                this.baseVy = (Math.random() - 0.5) * 0.8;
                this.vx = this.baseVx * particleSpeed;
                this.vy = this.baseVy * particleSpeed;
                this.size = Math.random() * 2.5 + 0.5;
                this.color = themeColors[Math.floor(Math.random() * themeColors.length)];
                this.alpha = Math.random() * 0.6 + 0.2;
                this.isFirework = isFirework;
                this.life = isFirework ? 80 : Infinity;
                this.maxLife = this.life;
            }
            update() {
                this.vx = this.baseVx * particleSpeed;
                this.vy = this.baseVy * particleSpeed;

                // Mouse repulsion
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    const force = (120 - dist) / 120 * 3;
                    this.vx += (dx / dist) * force;
                    this.vy += (dy / dist) * force;
                }

                if (gravityOn) {
                    this.vy += 0.05;
                    if (this.y > H) { this.y = 0; this.vy = 0; }
                }

                if (matrixMode) {
                    this.vy = Math.abs(this.baseVy) * particleSpeed * 3;
                    this.vx *= 0.3;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (!gravityOn && !matrixMode) {
                    if (this.x < 0) this.x = W;
                    if (this.x > W) this.x = 0;
                    if (this.y < 0) this.y = H;
                    if (this.y > H) this.y = 0;
                }

                if (this.isFirework) {
                    this.life--;
                    this.alpha = this.life / this.maxLife;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // Init particles
        const PARTICLE_COUNT = 120;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = particles[i].color;
                        ctx.globalAlpha = (1 - dist / 100) * 0.15;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, W, H);

            particles = particles.filter(p => p.life === Infinity || p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });

            if (!matrixMode) drawConnections();

            requestAnimationFrame(animate);
        }
        animate();

        /* ===== TYPEWRITER ===== */
        const subtitles = [
            '游戏玩家 · 羽毛球爱好者 · 轮滑少年',
            '乐观热忱，元气随性，直率坦荡',
            '热爱生活，享受每一刻精彩',
            '理智通透，独立自主，思虑周全'
        ];
        let subIdx = 0, charIdx = 0, isDeleting = false;
        const typewriterEl = document.getElementById('typewriter');

        function typeWriter() {
            const current = subtitles[subIdx];
            if (!isDeleting) {
                typewriterEl.textContent = current.substring(0, charIdx + 1);
                charIdx++;
                if (charIdx === current.length) {
                    setTimeout(() => { isDeleting = true; typeWriter(); }, 2000);
                    return;
                }
            } else {
                typewriterEl.textContent = current.substring(0, charIdx - 1);
                charIdx--;
                if (charIdx === 0) {
                    isDeleting = false;
                    subIdx = (subIdx + 1) % subtitles.length;
                }
            }
            setTimeout(typeWriter, isDeleting ? 40 : 80);
        }
        setTimeout(typeWriter, 500);

        /* ===== SCROLL REVEAL ===== */
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => {
                if (e.isIntersecting) e.target.classList.add('visible');
            });
        }, { threshold: 0.15 });
        document.querySelectorAll('.section').forEach(s => observer.observe(s));

        /* ===== HOBBY CARD MOUSE TRACKING ===== */
        document.querySelectorAll('.hobby-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty('--x', ((e.clientX - rect.left) / rect.width * 100) + '%');
                card.style.setProperty('--y', ((e.clientY - rect.top) / rect.height * 100) + '%');
            });
        });

        /* ===== TOAST ===== */
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        /* ===== SIDE BUTTON ACTIONS ===== */
        function sideAction(action) {
            switch (action) {
                case 'matrix':
                    matrixMode = !matrixMode;
                    showToast(matrixMode ? '矩阵模式已开启' : '矩阵模式已关闭');
                    break;
                case 'quote':
                    const quotes = [
                        '"生活就像一盒巧克力" —— Forrest Gump',
                        '"Stay hungry, stay foolish" —— Steve Jobs',
                        '"人生没有白走的路，每一步都算数" —— 李宗盛',
                        '"世界上只有一种英雄主义，就是看清生活后依然热爱它" —— 罗曼·罗兰',
                        '"做你自己，因为别人都有人做了" —— 奥斯卡·王尔德',
                        '"游戏可以重开，人生不能读档" —— 蒋昊'
                    ];
                    showToast(quotes[Math.floor(Math.random() * quotes.length)]);
                    break;
                case 'color':
                    currentTheme = (currentTheme + 1) % 3;
                    const themes = [
                        ['#00f0ff', '#b400ff', '#ff006e', '#00ff88'],
                        ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff'],
                        ['#f72585', '#b5179e', '#7209b7', '#4361ee']
                    ];
                    themeColors = themes[currentTheme];
                    showToast('主题色已切换');
                    break;
                case 'speed':
                    particleSpeed = particleSpeed === 1 ? 3 : particleSpeed === 3 ? 5 : 1;
                    showToast(`粒子速度: ${particleSpeed === 1 ? '正常' : particleSpeed === 3 ? '加速' : '极速'}`);
                    break;
                case 'gravity':
                    gravityOn = !gravityOn;
                    showToast(gravityOn ? '重力效果已开启' : '重力效果已关闭');
                    break;
                case 'firework':
                    for (let i = 0; i < 50; i++) {
                        const p = new Particle(W / 2, H / 2, true);
                        const angle = (Math.PI * 2 / 50) * i;
                        const speed = Math.random() * 5 + 2;
                        p.baseVx = Math.cos(angle) * speed;
                        p.baseVy = Math.sin(angle) * speed;
                        particles.push(p);
                    }
                    showToast('🎆 烟花绽放！');
                    break;
            }
        }

        /* ===== BOMB EXPLOSION ===== */
        function triggerBomb() {
            const overlay = document.getElementById('explosion-overlay');
            const flash = document.getElementById('explosion-flash');
            const restoreBtn = document.getElementById('restore-btn');
            const content = document.getElementById('main-content');

            // Play flash
            overlay.classList.add('active');
            flash.classList.add('animate');

            // Create explosion particles
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const colors = ['#ff006e', '#ff6b00', '#ffd900', '#ff3300', '#fff'];

            for (let i = 0; i < 200; i++) {
                const p = document.createElement('div');
                p.className = 'explosion-particle';
                const angle = (Math.PI * 2 / 200) * i + Math.random() * 0.5;
                const dist = Math.random() * 500 + 200;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;
                const size = Math.random() * 12 + 4;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const delay = Math.random() * 0.3;

                p.style.cssText = `
                    left: ${cx}px; top: ${cy}px;
                    width: ${size}px; height: ${size}px;
                    background: ${color};
                    border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                    animation: explode-particle 1.5s ${delay}s ease-out forwards;
                    --tx: ${tx}px; --ty: ${ty}px;
                `;
                overlay.appendChild(p);
            }

            // Add explosion keyframe dynamically
            if (!document.getElementById('explosion-style')) {
                const style = document.createElement('style');
                style.id = 'explosion-style';
                style.textContent = `
                    @keyframes explode-particle {
                        0% { transform: translate(0, 0) scale(1); opacity: 1; }
                        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
                    }
                    @keyframes content-shake {
                        0%, 100% { transform: translateX(0); }
                        10% { transform: translateX(-15px) rotate(-2deg); }
                        20% { transform: translateX(15px) rotate(2deg); }
                        30% { transform: translateX(-10px) rotate(-1deg); }
                        40% { transform: translateX(10px) rotate(1deg); }
                        50% { transform: translateX(-5px); }
                        60% { transform: translateX(5px); }
                        70% { transform: translateX(-2px); }
                        80% { transform: translateX(2px); }
                    }
                    @keyframes content-explode {
                        0% { opacity: 1; transform: scale(1) rotate(0); }
                        50% { opacity: 0.5; transform: scale(0.8) rotate(5deg); }
                        100% { opacity: 0; transform: scale(0) rotate(15deg) translateY(200px); }
                    }
                `;
                document.head.appendChild(style);
            }

            // Shake then explode content
            content.style.animation = 'content-shake 0.5s ease-in-out, content-explode 1s 0.5s ease-in forwards';

            // Show restore button
            setTimeout(() => {
                restoreBtn.classList.add('visible');
            }, 1800);
        }

        function restorePage() {
            const overlay = document.getElementById('explosion-overlay');
            const flash = document.getElementById('explosion-flash');
            const restoreBtn = document.getElementById('restore-btn');
            const content = document.getElementById('main-content');

            // Clean up explosion particles
            overlay.querySelectorAll('.explosion-particle').forEach(p => p.remove());
            flash.classList.remove('animate');
            restoreBtn.classList.remove('visible');
            overlay.classList.remove('active');

            content.style.animation = 'none';
            content.offsetHeight; // Trigger reflow
            content.style.animation = 'fade-in 1s ease forwards';
        }
    </script>
</body>
</html>
