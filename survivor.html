<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>生存幸存者</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:'Segoe UI','Microsoft YaHei',sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}
#hud{position:absolute;top:0;left:0;right:0;padding:10px 15px;display:none;justify-content:space-between;align-items:flex-start}
.hud-left,.hud-right{display:flex;flex-direction:column;gap:5px}
.hud-bar{width:180px;height:12px;background:rgba(0,0,0,0.6);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)}
.hud-fill{height:100%;transition:width .2s;border-radius:6px}
.hp-fill{background:linear-gradient(90deg,#e74c3c,#ff6b6b)}.xp-fill{background:linear-gradient(90deg,#3498db,#74b9ff)}
.hud-bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.hud-stat{font-size:11px;color:#aaa;font-weight:600;text-shadow:0 1px 2px #000}
.hud-time{font-size:22px;color:#fff;font-weight:900;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.hud-level{font-size:13px;color:#f1c40f;font-weight:700}
#ultBtn{position:fixed;bottom:60px;right:30px;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#f1c40f,#e67e22);border:3px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:900;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 4px 15px rgba(241,196,15,.4)}
#ultBtn.ready{animation:ultPulse .8s infinite alternate;border-color:#2ecc71;box-shadow:0 4px 25px rgba(46,204,113,.6)}
@keyframes ultPulse{from{transform:scale(1)}to{transform:scale(1.1)}}
#joystick{position:fixed;bottom:40px;left:40px;width:130px;height:130px;display:none;z-index:20}
#joyBase{width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15)}
#joyKnob{width:50px;height:50px;border-radius:50%;background:rgba(52,152,219,.5);border:2px solid rgba(52,152,219,.8);position:absolute;top:40px;left:40px;pointer-events:none}
#start-screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#1a1a3e 0%,#0a0a12 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#start-screen h1{font-size:clamp(36px,6vw,64px);font-weight:900;background:linear-gradient(135deg,#3498db,#e74c3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:4px}
#start-screen .sub{font-size:13px;color:#666;margin-bottom:35px}
#start-screen .ctrl{color:#555;font-size:12px;margin-bottom:30px;text-align:center;line-height:2.2}
#start-screen kbd{background:#1a1a2e;padding:3px 10px;border-radius:4px;border:1px solid #333;color:#ccc;font-size:11px}
.btn-main{padding:14px 55px;font-size:18px;font-weight:700;background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;border:none;border-radius:12px;cursor:pointer;letter-spacing:4px;transition:all .3s}
#upgrade-menu{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50}
#upgrade-menu.on{display:flex}
#upgrade-menu h2{color:#f1c40f;font-size:26px;margin-bottom:6px}
#upgrade-menu .ulv{color:#777;font-size:13px;margin-bottom:25px}
.ucards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ucard{width:170px;padding:18px 12px;background:linear-gradient(135deg,#141428,#1a1a35);border:2px solid #2a2a4a;border-radius:12px;text-align:center;cursor:pointer;transition:all .3s}
.ucard:hover{border-color:#f1c40f;transform:translateY(-4px)}
.ucard .ui{font-size:34px;margin-bottom:8px}.ucard .un{color:#fff;font-size:14px;font-weight:700;margin-bottom:5px}
.ucard .ud{color:#777;font-size:11px;line-height:1.5}.ucard .ul{color:#f1c40f;font-size:10px;margin-top:6px}
#death-screen{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:60}
#death-screen.on{display:flex}
#death-screen h1{font-size:44px;color:#e74c3c;font-weight:900;margin-bottom:18px}
.dstats{display:flex;gap:35px;margin-bottom:28px}.ds{text-align:center}
.ds .dv{font-size:28px;font-weight:900;color:#fff}.ds .dl{font-size:11px;color:#777;margin-top:3px}
.btn-red{padding:12px 45px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;border:none;border-radius:10px;cursor:pointer;letter-spacing:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="hud"><div class="hud-left">
<div class="hud-bar" style="position:relative"><div class="hud-fill hp-fill" id="hpBar"></div><div class="hud-bar-text" id="hpTxt">100/100</div></div>
<div class="hud-bar" style="position:relative"><div class="hud-fill xp-fill" id="xpBar"></div><div class="hud-bar-text" id="xpTxt">0/20</div></div>
</div><div class="hud-time" id="hudTime">0:00</div><div class="hud-right">
<div class="hud-level" id="hudLv">Lv.1</div><div class="hud-stat" id="hudKills">击杀: 0</div>
<div class="hud-stat" id="hudWep">武器: -</div><div class="hud-stat" id="hudUlt" style="color:#f1c40f">大招: 0/50</div>
<div class="hud-stat" id="hudBerserk" style="color:#e74c3c;display:none">狂暴: 0s</div>
</div></div></div>
<div id="joystick"><div id="joyBase"><div id="joyKnob"></div></div></div>
<button id="ultBtn" ontouchstart="mobUlt()" onclick="mobUlt()">大招</button>
<div id="start-screen"><h1>生存幸存者</h1><div class="sub">活下来，击败一切</div>
<div class="ctrl" id="ctrlInfo"><kbd>W A S D</kbd> 移动 | <kbd>空格</kbd> 大招<br>武器自动攻击 · 收集经验升级 · 击杀充能大招</div>
<button class="btn-main" onclick="startGame()">开始游戏</button></div>
<div id="upgrade-menu"><h2>升级</h2><div class="ulv" id="upLv"></div><div class="ucards" id="upCards"></div></div>
<div id="death-screen"><h1>阵亡</h1><div class="dstats">
<div class="ds"><div class="dv" id="dTime">0:00</div><div class="dl">存活时间</div></div>
<div class="ds"><div class="dv" id="dKills">0</div><div class="dl">击杀数</div></div>
<div class="ds"><div class="dv" id="dLv">1</div><div class="dl">等级</div></div></div>
<button class="btn-red" onclick="restartGame()">再来一次</button></div>
<script>
// ============================================================
// 生存幸存者 - 完整游戏逻辑
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// 游戏配置
const CONFIG = {
  PLAYER: { radius: 12, speed: 3, maxHp: 100, baseXp: 50, xpMultiplier: 0.5 },
  ENEMY: { baseHp: 10, baseSpeed: 1, spawnRate: 60, maxSpawnRate: 15 },
  WEAPONS: {
    bullet: { name: '子弹', icon: '🔫', damage: 8, cooldown: 20, speed: 8, color: '#f39c12' },
    orbit: { name: '环绕球', icon: '🔮', damage: 5, cooldown: 0, speed: 0, count: 3, radius: 60, color: '#9b59b6' },
    laser: { name: '激光', icon: '⚡', damage: 15, cooldown: 40, speed: 0, color: '#e74c3c', width: 4 },
    area: { name: '范围伤害', icon: '💥', damage: 12, cooldown: 60, speed: 0, radius: 80, color: '#e67e22' }
  },
  ULTIMATE: { chargePerKill: 1, maxCharge: 50, damage: 100, radius: 150 },
  BERSERK: { duration: 5, damageMultiplier: 2, speedMultiplier: 1.5 }
};

// 游戏状态
let game = {
  state: 'menu', // menu, playing, paused, upgrading, dead
  time: 0,
  kills: 0,
  level: 1,
  xp: 0,
  xpToNext: CONFIG.PLAYER.baseXp,
  ultCharge: 0,
  berserkTimer: 0,
  lastTime: 0,
  deltaTime: 0,
  frameCount: 0
};

// 实体
let player = null;
let enemies = [];
let bullets = [];
let xpOrbs = [];
let particles = [];
let damageNumbers = [];
let screenShake = { x: 0, y: 0, intensity: 0 };

// 星空系统
let stars = [];
function initStars() {
  stars = [];
  for (let i = 0; i < 150; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      alpha: Math.random() * 0.8 + 0.2,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinkleOffset: Math.random() * Math.PI * 2
    });
  }
}
initStars();

// 装饰光晕
const ambientGlows = [];
function initAmbientGlows() {
  for (let i = 0; i < 5; i++) {
    ambientGlows.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 200 + 100,
      color: `hsla(${Math.random() * 360}, 70%, 50%, 0.03)`,
      speed: Math.random() * 0.3 + 0.1,
      angle: Math.random() * Math.PI * 2
    });
  }
}
initAmbientGlows();

// 输入
let keys = {};
let joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0 };

// 武器系统
let weapons = {
  bullet: { level: 0, maxLevel: 5, unlocked: true },
  orbit: { level: 0, maxLevel: 5, unlocked: false },
  laser: { level: 0, maxLevel: 5, unlocked: false },
  area: { level: 0, maxLevel: 5, unlocked: false }
};

let weaponCooldowns = { bullet: 0, orbit: 0, laser: 0, area: 0 };
let orbitAngle = 0;
let playerAngle = 0;
let playerTrail = [];
let ultEffect = { active: false, phase: 0, timer: 0, radius: 0, shockwaves: [], particles: [], crackAngles: [] };

// 升级选项
const UPGRADES = [
  { id: 'bullet', name: '子弹强化', icon: '🔫', desc: '提升子弹伤害和射速', type: 'weapon' },
  { id: 'orbit', name: '环绕球', icon: '🔮', desc: '获得环绕自身的伤害球', type: 'weapon' },
  { id: 'laser', name: '激光束', icon: '⚡', desc: '周期性发射高伤害激光', type: 'weapon' },
  { id: 'area', name: '范围爆炸', icon: '💥', desc: '周期性造成范围伤害', type: 'weapon' },
  { id: 'hp', name: '生命强化', icon: '❤️', desc: '增加最大生命值并回复', type: 'stat' },
  { id: 'speed', name: '速度提升', icon: '💨', desc: '提升移动速度', type: 'stat' },
  { id: 'xp', name: '经验加成', icon: '⭐', desc: '提升经验获取效率', type: 'stat' },
  { id: 'berserk', name: '狂暴之力', icon: '🔥', desc: '击杀有概率触发狂暴', type: 'stat' }
];

// ============================================================
// 初始化
// ============================================================

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initStars();
  initAmbientGlows();
}
window.addEventListener('resize', resize);
resize();

// DOM缓存
const DOM = {
  startScreen: document.getElementById('start-screen'),
  hud: document.getElementById('hud'),
  deathScreen: document.getElementById('death-screen'),
  upgradeMenu: document.getElementById('upgrade-menu'),
  hpBar: document.getElementById('hpBar'),
  hpTxt: document.getElementById('hpTxt'),
  xpBar: document.getElementById('xpBar'),
  xpTxt: document.getElementById('xpTxt'),
  hudTime: document.getElementById('hudTime'),
  hudLv: document.getElementById('hudLv'),
  hudKills: document.getElementById('hudKills'),
  hudWep: document.getElementById('hudWep'),
  hudUlt: document.getElementById('hudUlt'),
  hudBerserk: document.getElementById('hudBerserk'),
  upLv: document.getElementById('upLv'),
  upCards: document.getElementById('upCards'),
  dTime: document.getElementById('dTime'),
  dKills: document.getElementById('dKills'),
  dLv: document.getElementById('dLv'),
  ultBtn: document.getElementById('ultBtn'),
  joystick: document.getElementById('joystick'),
  joyKnob: document.getElementById('joyKnob'),
  ctrlInfo: document.getElementById('ctrlInfo')
};

function initPlayer() {
  player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    vx: 0, vy: 0,
    hp: CONFIG.PLAYER.maxHp,
    maxHp: CONFIG.PLAYER.maxHp,
    speed: CONFIG.PLAYER.speed,
    radius: CONFIG.PLAYER.radius
  };
}

// 对象池
const POOL = {
  particles: [],
  bullets: [],
  xpOrbs: [],
  damageNumbers: []
};

function getFromPool(pool, factory) {
  return pool.length > 0 ? pool.pop() : factory();
}

function returnToPool(pool, obj) {
  if (pool.length < 500) pool.push(obj);
}

function clearPool(pool) {
  pool.length = 0;
}

// ============================================================
// 输入处理
// ============================================================

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' && game.state === 'playing') {
    e.preventDefault();
    useUltimate();
  }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// 虚拟摇杆
const joystickEl = document.getElementById('joystick');
const joyKnob = document.getElementById('joyKnob');

function setupJoystick() {
  let touchId = null;
  
  canvas.addEventListener('touchstart', e => {
    if (game.state !== 'playing') return;
    for (let t of e.changedTouches) {
      if (t.clientX < canvas.width / 2 && touchId === null) {
        touchId = t.identifier;
        joystick.active = true;
        joystick.originX = t.clientX;
        joystick.originY = t.clientY;
        joystickEl.style.display = 'block';
        joystickEl.style.left = (t.clientX - 65) + 'px';
        joystickEl.style.top = (t.clientY - 65) + 'px';
        joyKnob.style.left = '40px';
        joyKnob.style.top = '40px';
      }
    }
  });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) {
        const dx = t.clientX - joystick.originX;
        const dy = t.clientY - joystick.originY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 45;
        const clampDist = Math.min(dist, maxDist);
        const angle = Math.atan2(dy, dx);
        joystick.dx = Math.cos(angle) * (clampDist / maxDist);
        joystick.dy = Math.sin(angle) * (clampDist / maxDist);
        joyKnob.style.left = (40 + joystick.dx * 45) + 'px';
        joyKnob.style.top = (40 + joystick.dy * 45) + 'px';
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) {
        touchId = null;
        joystick.active = false;
        joystick.dx = 0;
        joystick.dy = 0;
        joystickEl.style.display = 'none';
      }
    }
  });
}
setupJoystick();

// 预计算缓存
const MATH_CACHE = { cos: new Float32Array(360), sin: new Float32Array(360) };
for (let i = 0; i < 360; i++) {
  MATH_CACHE.cos[i] = Math.cos(i * Math.PI / 180);
  MATH_CACHE.sin[i] = Math.sin(i * Math.PI / 180);
}

function fastCos(angle) {
  const idx = ((angle * 180 / Math.PI) % 360 + 360) % 360;
  return MATH_CACHE.cos[Math.floor(idx)];
}

function fastSin(angle) {
  const idx = ((angle * 180 / Math.PI) % 360 + 360) % 360;
  return MATH_CACHE.sin[Math.floor(idx)];
}

// ============================================================
// 游戏控制
// ============================================================

// 游戏循环控制
let rAFId = null;
let isRunning = false;

function gameLoop(timestamp) {
  if (game.state === 'menu' || game.state === 'dead') return;
  if (!isRunning) return;

  game.deltaTime = Math.min((timestamp - game.lastTime) / 16.67, 3);
  game.lastTime = timestamp;
  game.frameCount++;

  if (game.state === 'playing') {
    game.time += game.deltaTime;
    updatePlayer();
    updateWeapons();
    updateEnemies();
    updateBullets();
    updateXpOrbs();
    updateParticles();
    updateDamageNumbers();
    checkCollisions();
    spawnEnemies();
    updateScreenShake();
    updateHUD();
    updateUltEffect();
  }

  render();
  rAFId = requestAnimationFrame(gameLoop);
}

function startGameLoop() {
  isRunning = true;
  if (rAFId) cancelAnimationFrame(rAFId);
  rAFId = requestAnimationFrame(gameLoop);
}

function stopGameLoop() {
  isRunning = false;
  if (rAFId) {
    cancelAnimationFrame(rAFId);
    rAFId = null;
  }
}

function startGame() {
  DOM.startScreen.style.display = 'none';
  DOM.hud.style.display = 'flex';
  
  game.state = 'playing';
  game.time = 0;
  game.kills = 0;
  game.level = 1;
  game.xp = 0;
  game.xpToNext = CONFIG.PLAYER.baseXp;
  game.ultCharge = 0;
  game.berserkTimer = 0;
  game.frameCount = 0;
  game.lastTime = performance.now();

  initPlayer();
  enemies = [];
  bullets = [];
  xpOrbs = [];
  particles = [];
  damageNumbers = [];
  playerTrail = [];

  weapons = {
    bullet: { level: 1, maxLevel: 5, unlocked: true },
    orbit: { level: 0, maxLevel: 5, unlocked: false },
    laser: { level: 0, maxLevel: 5, unlocked: false },
    area: { level: 0, maxLevel: 5, unlocked: false }
  };
  weaponCooldowns = { bullet: 0, orbit: 0, laser: 0, area: 0 };

  updateHUD();
  startGameLoop();
}

function restartGame() {
  DOM.deathScreen.classList.remove('on');
  startGame();
}

function showUpgradeMenu() {
  game.state = 'upgrading';
  DOM.upgradeMenu.classList.add('on');
  DOM.upLv.textContent = `等级 ${game.level}`;
  DOM.upCards.innerHTML = '';

  const available = UPGRADES.filter(u => {
    if (u.type === 'weapon') {
      const w = weapons[u.id];
      return w && w.level < w.maxLevel && (w.unlocked || w.level === 0);
    }
    return true;
  });

  const choices = shuffleArray([...available]).slice(0, 3);
  
  const fragment = document.createDocumentFragment();
  choices.forEach(u => {
    const card = document.createElement('div');
    card.className = 'ucard';
    const w = weapons[u.id];
    const levelText = w ? `Lv.${w.level} → Lv.${w.level + 1}` : 'NEW';
    card.innerHTML = `<div class="ui">${u.icon}</div><div class="un">${u.name}</div><div class="ud">${u.desc}</div><div class="ul">${levelText}</div>`;
    card.onclick = () => applyUpgrade(u);
    fragment.appendChild(card);
  });
  DOM.upCards.appendChild(fragment);
}

function applyUpgrade(upgrade) {
  if (upgrade.type === 'weapon') {
    const w = weapons[upgrade.id];
    w.level++;
    w.unlocked = true;
  } else {
    switch (upgrade.id) {
      case 'hp':
        player.maxHp += 20;
        player.hp = Math.min(player.hp + 30, player.maxHp);
        break;
      case 'speed':
        player.speed += 0.5;
        break;
      case 'xp':
        CONFIG.PLAYER.xpMultiplier += 0.2;
        break;
    }
  }

  DOM.upgradeMenu.classList.remove('on');
  game.state = 'playing';
  updateHUD();
}

function showDeathScreen() {
  game.state = 'dead';
  DOM.deathScreen.classList.add('on');
  DOM.dTime.textContent = formatTime(game.time);
  DOM.dKills.textContent = game.kills;
  DOM.dLv.textContent = game.level;
}

// ============================================================
// 玩家更新
// ============================================================

function updatePlayer() {
  let dx = 0, dy = 0;

  if (keys['w'] || keys['arrowup']) dy = -1;
  if (keys['s'] || keys['arrowdown']) dy = 1;
  if (keys['a'] || keys['arrowleft']) dx = -1;
  if (keys['d'] || keys['arrowright']) dx = 1;

  if (joystick.active) {
    dx = joystick.dx;
    dy = joystick.dy;
  }

  const len = Math.sqrt(dx * dx + dy * dy);
  if (len > 0.01) {
    dx /= len;
    dy /= len;
    playerAngle = Math.atan2(dy, dx);
    playerTrail.push({ x: player.x, y: player.y, life: 15, maxLife: 15, radius: player.radius * 0.8 });
  }

  const speedMult = game.berserkTimer > 0 ? CONFIG.BERSERK.speedMultiplier : 1;
  player.x += dx * player.speed * speedMult * game.deltaTime;
  player.y += dy * player.speed * speedMult * game.deltaTime;

  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

  for (let i = 0, len = playerTrail.length; i < len; i++) {
    playerTrail[i].life -= game.deltaTime;
  }
  playerTrail = playerTrail.filter(t => t.life > 0);

  if (game.berserkTimer > 0) {
    game.berserkTimer -= game.deltaTime / 60;
    if (game.berserkTimer <= 0) {
      game.berserkTimer = 0;
      DOM.hudBerserk.style.display = 'none';
    }
  }
}

// ============================================================
// 武器系统
// ============================================================

function updateWeapons() {
  const dmgMult = game.berserkTimer > 0 ? CONFIG.BERSERK.damageMultiplier : 1;

  // 子弹
  if (weapons.bullet.level > 0) {
    weaponCooldowns.bullet -= game.deltaTime;
    if (weaponCooldowns.bullet <= 0) {
      const cd = Math.max(5, CONFIG.WEAPONS.bullet.cooldown - weapons.bullet.level * 3);
      weaponCooldowns.bullet = cd;
      fireBullet(dmgMult);
    }
  }

  // 环绕球
  if (weapons.orbit.level > 0) {
    orbitAngle += 0.05 * game.deltaTime;
    const count = CONFIG.WEAPONS.orbit.count + weapons.orbit.level - 1;
    const radius = CONFIG.WEAPONS.orbit.radius + weapons.orbit.level * 10;
    for (let i = 0; i < count; i++) {
      const angle = orbitAngle + (Math.PI * 2 / count) * i;
      const bx = player.x + Math.cos(angle) * radius;
      const by = player.y + Math.sin(angle) * radius;
      // 检查与敌人碰撞
      enemies.forEach(e => {
        if (e.hp <= 0) return;
        const dist = Math.hypot(bx - e.x, by - e.y);
        if (dist < e.radius + 10) {
          const dmg = (CONFIG.WEAPONS.orbit.damage + weapons.orbit.level * 2) * dmgMult;
          damageEnemy(e, dmg);
        }
      });
    }
  }

  // 激光
  if (weapons.laser.level > 0) {
    weaponCooldowns.laser -= game.deltaTime;
    if (weaponCooldowns.laser <= 0) {
      weaponCooldowns.laser = Math.max(20, CONFIG.WEAPONS.laser.cooldown - weapons.laser.level * 5);
      fireLaser(dmgMult);
    }
  }

  // 范围伤害
  if (weapons.area.level > 0) {
    weaponCooldowns.area -= game.deltaTime;
    if (weaponCooldowns.area <= 0) {
      weaponCooldowns.area = Math.max(30, CONFIG.WEAPONS.area.cooldown - weapons.area.level * 5);
      fireArea(dmgMult);
    }
  }
}

function fireBullet(dmgMult) {
  // 找最近的敌人
  let nearest = null, minDist = Infinity;
  enemies.forEach(e => {
    if (e.hp <= 0) return;
    const dist = Math.hypot(e.x - player.x, e.y - player.y);
    if (dist < minDist) { minDist = dist; nearest = e; }
  });

  if (!nearest) return;

  const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
  const dmg = (CONFIG.WEAPONS.bullet.damage + weapons.bullet.level * 3) * dmgMult;
  
  bullets.push({
    x: player.x, y: player.y,
    vx: Math.cos(angle) * CONFIG.WEAPONS.bullet.speed,
    vy: Math.sin(angle) * CONFIG.WEAPONS.bullet.speed,
    damage: dmg,
    radius: 4,
    color: CONFIG.WEAPONS.bullet.color,
    life: 120
  });
}

function fireLaser(dmgMult) {
  // 找最近的敌人方向
  let nearest = null, minDist = Infinity;
  enemies.forEach(e => {
    if (e.hp <= 0) return;
    const dist = Math.hypot(e.x - player.x, e.y - player.y);
    if (dist < minDist) { minDist = dist; nearest = e; }
  });

  const angle = nearest ? Math.atan2(nearest.y - player.y, nearest.x - player.x) : Math.random() * Math.PI * 2;
  const dmg = (CONFIG.WEAPONS.laser.damage + weapons.laser.level * 5) * dmgMult;
  const width = CONFIG.WEAPONS.laser.width + weapons.laser.level;

  // 激光穿透所有敌人
  const laserLen = Math.max(canvas.width, canvas.height);
  const endX = player.x + Math.cos(angle) * laserLen;
  const endY = player.y + Math.sin(angle) * laserLen;

  enemies.forEach(e => {
    if (e.hp <= 0) return;
    const dist = pointToLineDistance(e.x, e.y, player.x, player.y, endX, endY);
    if (dist < e.radius + width) {
      damageEnemy(e, dmg);
    }
  });

  // 激光视觉效果
  for (let i = 0; i < 20; i++) {
    const t = i / 20;
    particles.push({
      x: player.x + (endX - player.x) * t,
      y: player.y + (endY - player.y) * t,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      life: 15,
      maxLife: 15,
      radius: width + Math.random() * 3,
      color: CONFIG.WEAPONS.laser.color
    });
  }
}

function fireArea(dmgMult) {
  const radius = CONFIG.WEAPONS.area.radius + weapons.area.level * 15;
  const dmg = (CONFIG.WEAPONS.area.damage + weapons.area.level * 4) * dmgMult;

  enemies.forEach(e => {
    if (e.hp <= 0) return;
    const dist = Math.hypot(e.x - player.x, e.y - player.y);
    if (dist < radius + e.radius) {
      damageEnemy(e, dmg);
    }
  });

  // 范围爆炸效果
  for (let i = 0; i < 30; i++) {
    const angle = (Math.PI * 2 / 30) * i;
    const speed = Math.random() * 4 + 2;
    particles.push({
      x: player.x,
      y: player.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 30,
      maxLife: 30,
      radius: 5 + Math.random() * 5,
      color: CONFIG.WEAPONS.area.color
    });
  }

  addScreenShake(5);
}

function useUltimate() {
  if (game.ultCharge < CONFIG.ULTIMATE.maxCharge) return;

  game.ultCharge = 0;
  const radius = CONFIG.ULTIMATE.radius;
  const dmg = CONFIG.ULTIMATE.damage;

  // 立即造成伤害
  enemies.forEach(e => {
    if (e.hp <= 0) return;
    const dist = Math.hypot(e.x - player.x, e.y - player.y);
    if (dist < radius + e.radius) {
      damageEnemy(e, dmg);
    }
  });

  // 激活大招特效系统
  ultEffect.active = true;
  ultEffect.phase = 0;
  ultEffect.timer = 0;
  ultEffect.radius = 0;
  ultEffect.shockwaves = [];
  ultEffect.particles = [];
  ultEffect.crackAngles = [];

  // 预生成裂纹角度
  for (let i = 0; i < 12; i++) {
    const baseAngle = (6.2832 / 12) * i;
    const segments = [];
    for (let j = 0; j < 5; j++) {
      segments.push(baseAngle + (Math.random() - 0.5) * 0.3);
    }
    ultEffect.crackAngles.push(segments);
  }

  // 蓄力阶段: 能量向内汇聚
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 80;
    ultEffect.particles.push({
      x: player.x + Math.cos(angle) * dist,
      y: player.y + Math.sin(angle) * dist,
      targetX: player.x,
      targetY: player.y,
      life: 40,
      maxLife: 40,
      radius: 3 + Math.random() * 3,
      color: ['#f1c40f', '#e67e22', '#e74c3c', '#fff'][Math.floor(Math.random() * 4)]
    });
  }

  addScreenShake(15);
  updateHUD();
}

function updateUltEffect() {
  if (!ultEffect.active) return;

  ultEffect.timer++;

  // 阶段0: 蓄力 (0-25帧)
  if (ultEffect.phase === 0) {
    if (ultEffect.timer >= 25) {
      ultEffect.phase = 1;
      ultEffect.timer = 0;
      // 爆发: 创建多圈冲击波
      for (let i = 0; i < 3; i++) {
        ultEffect.shockwaves.push({
          radius: 0,
          maxRadius: CONFIG.ULTIMATE.radius + i * 50,
          speed: 8 - i * 1.5,
          alpha: 1,
          color: ['#f1c40f', '#e67e22', '#e74c3c'][i],
          delay: i * 8
        });
      }
      // 爆炸粒子
      for (let i = 0; i < 40; i++) {
        const angle = (6.2832 / 40) * i + Math.random() * 0.2;
        const speed = Math.random() * 8 + 4;
        ultEffect.particles.push({
          x: player.x,
          y: player.y,
          vx: fastCos(angle) * speed,
          vy: fastSin(angle) * speed,
          life: 50 + Math.random() * 20,
          maxLife: 70,
          radius: 4 + Math.random() * 6,
          color: ['#f1c40f', '#e67e22', '#e74c3c', '#fff', '#ff6b6b'][Math.floor(Math.random() * 5)]
        });
      }
      addScreenShake(20);
    } else {
      // 更新蓄力粒子(向内收缩)
      for (let i = 0, len = ultEffect.particles.length; i < len; i++) {
        const p = ultEffect.particles[i];
        if (p.targetX !== undefined) {
          p.x += (p.targetX - p.x) * 0.15;
          p.y += (p.targetY - p.y) * 0.15;
          p.life--;
        }
      }
    }
  }

  // 阶段1: 爆发+冲击波扩散 (25帧后)
  if (ultEffect.phase === 1) {
    // 更新冲击波
    let allDone = true;
    for (let i = 0, len = ultEffect.shockwaves.length; i < len; i++) {
      const sw = ultEffect.shockwaves[i];
      if (sw.delay > 0) {
        sw.delay--;
        allDone = false;
        continue;
      }
      sw.radius += sw.speed * game.deltaTime;
      sw.alpha = 1 - (sw.radius / sw.maxRadius);
      if (sw.radius < sw.maxRadius) {
        allDone = false;
      }
    }

    // 更新爆发粒子
    let aliveCount = 0;
    for (let i = ultEffect.particles.length - 1; i >= 0; i--) {
      const p = ultEffect.particles[i];
      if (p.targetX !== undefined) { aliveCount++; continue; }
      p.x += p.vx * game.deltaTime;
      p.y += p.vy * game.deltaTime;
      p.vx *= 0.97;
      p.vy *= 0.97;
      p.life -= game.deltaTime;
      p.radius *= 0.98;
      if (p.life > 0) aliveCount++;
      else ultEffect.particles.splice(i, 1);
    }

    if (allDone && aliveCount === 0) {
      ultEffect.active = false;
    }
  }
}

// ============================================================
// 敌人系统
// ============================================================

function spawnEnemies() {
  const spawnRate = Math.max(CONFIG.ENEMY.maxSpawnRate, CONFIG.ENEMY.spawnRate - game.time / 100);
  
  if (game.frameCount % Math.floor(spawnRate) === 0) {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    const margin = 50;

    switch (side) {
      case 0: x = -margin; y = Math.random() * canvas.height; break;
      case 1: x = canvas.width + margin; y = Math.random() * canvas.height; break;
      case 2: x = Math.random() * canvas.width; y = -margin; break;
      case 3: x = Math.random() * canvas.width; y = canvas.height + margin; break;
    }

    const levelScale = 1 + game.time / 3000;
    const enemyType = Math.random();
    let hpBarType, hp, speed, radius, damage;

    if (enemyType < 0.5) {
      // 普通敌人 - 标准血条
      hpBarType = 'normal';
      hp = CONFIG.ENEMY.baseHp * levelScale;
      speed = CONFIG.ENEMY.baseSpeed + game.time / 5000;
      radius = 10 + Math.random() * 5;
      damage = 5 + game.time / 1000;
    } else if (enemyType < 0.8) {
      // 快速敌人 - 细长血条
      hpBarType = 'fast';
      hp = CONFIG.ENEMY.baseHp * levelScale * 0.6;
      speed = CONFIG.ENEMY.baseSpeed * 1.5 + game.time / 4000;
      radius = 8 + Math.random() * 3;
      damage = 4 + game.time / 1200;
    } else if (enemyType < 0.95) {
      // 坦克敌人 - 粗厚血条
      hpBarType = 'tank';
      hp = CONFIG.ENEMY.baseHp * levelScale * 2.5;
      speed = CONFIG.ENEMY.baseSpeed * 0.6 + game.time / 6000;
      radius = 15 + Math.random() * 5;
      damage = 8 + game.time / 800;
    } else {
      // 精英敌人 - 双层血条
      hpBarType = 'elite';
      hp = CONFIG.ENEMY.baseHp * levelScale * 4;
      speed = CONFIG.ENEMY.baseSpeed * 0.8 + game.time / 5000;
      radius = 18 + Math.random() * 4;
      damage = 12 + game.time / 600;
    }

    enemies.push({
      x, y,
      hp, maxHp: hp,
      speed,
      radius,
      color: hpBarType === 'fast' ? `hsl(${Math.random() * 60 + 120}, 80%, 50%)` :
             hpBarType === 'tank' ? `hsl(${Math.random() * 60 + 200}, 70%, 40%)` :
             hpBarType === 'elite' ? `hsl(${Math.random() * 60 + 280}, 90%, 50%)` :
             `hsl(${Math.random() * 60 + 340}, 70%, 50%)`,
      damage,
      hpBarType,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.05,
      pulseOffset: Math.random() * Math.PI * 2,
      spikes: hpBarType === 'elite' ? 8 : hpBarType === 'tank' ? 6 : hpBarType === 'fast' ? 3 : 4
    });
  }
}

function updateEnemies() {
  for (let i = 0, len = enemies.length; i < len; i++) {
    const e = enemies[i];
    if (e.hp <= 0) continue;
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.01) {
      e.x += (dx / dist) * e.speed * game.deltaTime;
      e.y += (dy / dist) * e.speed * game.deltaTime;
    }
    e.rotation += e.rotSpeed * game.deltaTime;
  }

  enemies = enemies.filter(e => e.hp > 0);
}

function damageEnemy(e, dmg) {
  e.hp -= dmg;
  showDamageNumber(e.x, e.y - e.radius, Math.round(dmg), 'damage');

  if (e.hp <= 0) {
    game.kills++;
    game.ultCharge = Math.min(CONFIG.ULTIMATE.maxCharge, game.ultCharge + CONFIG.ULTIMATE.chargePerKill);

    if (Math.random() < 0.1 && game.berserkTimer === 0) {
      game.berserkTimer = CONFIG.BERSERK.duration;
      DOM.hudBerserk.style.display = 'block';
    }

    const xpAmount = (5 + game.level * 2) * CONFIG.PLAYER.xpMultiplier;
    xpOrbs.push({
      x: e.x + (Math.random() - 0.5) * 20,
      y: e.y + (Math.random() - 0.5) * 20,
      value: xpAmount,
      radius: 6,
      life: 300
    });

    for (let i = 0; i < 8; i++) {
      particles.push({
        x: e.x, y: e.y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        life: 20, maxLife: 20,
        radius: 3 + Math.random() * 3,
        color: e.color
      });
    }

    addScreenShake(2);
  }
}

// ============================================================
// 子弹更新
// ============================================================

function updateBullets() {
  for (let i = 0, len = bullets.length; i < len; i++) {
    const b = bullets[i];
    b.x += b.vx * game.deltaTime;
    b.y += b.vy * game.deltaTime;
    b.life -= game.deltaTime;

    if (b.life <= 0) continue;

    for (let j = 0, elen = enemies.length; j < elen; j++) {
      const e = enemies[j];
      if (e.hp <= 0) continue;
      const dist = Math.hypot(b.x - e.x, b.y - e.y);
      if (dist < e.radius + b.radius) {
        damageEnemy(e, b.damage);
        b.life = 0;
        break;
      }
    }
  }

  bullets = bullets.filter(b => b.life > 0 && b.x > -50 && b.x < canvas.width + 50 && b.y > -50 && b.y < canvas.height + 50);
}

function updateXpOrbs() {
  for (let i = 0, len = xpOrbs.length; i < len; i++) {
    const orb = xpOrbs[i];
    orb.life -= game.deltaTime;

    const dist = Math.hypot(orb.x - player.x, orb.y - player.y);
    if (dist < 100 && dist > 0.01) {
      const speed = (100 - dist) / 100 * 5;
      orb.x += (player.x - orb.x) / dist * speed * game.deltaTime;
      orb.y += (player.y - orb.y) / dist * speed * game.deltaTime;
    }

    if (dist < player.radius + orb.radius) {
      game.xp += orb.value;
      orb.life = 0;

      if (game.xp >= game.xpToNext) {
        game.xp -= game.xpToNext;
        game.level++;
        game.xpToNext = Math.floor(game.xpToNext * 1.8);
        showUpgradeMenu();
      }
    }
  }

  xpOrbs = xpOrbs.filter(o => o.life > 0);
}

function updateParticles() {
  for (let i = 0, len = particles.length; i < len; i++) {
    const p = particles[i];
    p.x += p.vx * game.deltaTime;
    p.y += p.vy * game.deltaTime;
    p.life -= game.deltaTime;
    p.radius *= 0.98;
  }
  particles = particles.filter(p => p.life > 0);
}

function updateDamageNumbers() {
  for (let i = 0, len = damageNumbers.length; i < len; i++) {
    const d = damageNumbers[i];
    d.y -= 1 * game.deltaTime;
    d.life -= game.deltaTime;
  }
  damageNumbers = damageNumbers.filter(d => d.life > 0);
}

function showDamageNumber(x, y, value, type) {
  damageNumbers.push({
    x, y, value, type,
    life: 40,
    maxLife: 40
  });
}

// ============================================================
// 碰撞检测
// ============================================================

function checkCollisions() {
  for (let i = 0, len = enemies.length; i < len; i++) {
    const e = enemies[i];
    if (e.hp <= 0) continue;
    const dist = Math.hypot(e.x - player.x, e.y - player.y);
    if (dist < e.radius + player.radius) {
      player.hp -= e.damage * game.deltaTime / 60;
      if (player.hp <= 0) {
        player.hp = 0;
        showDeathScreen();
        return;
      }
    }
  }
}

// ============================================================
// 屏幕震动
// ============================================================

function addScreenShake(intensity) {
  screenShake.intensity = Math.max(screenShake.intensity, intensity);
}

function updateScreenShake() {
  if (screenShake.intensity > 0) {
    screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
    screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
    screenShake.intensity *= 0.9;
    if (screenShake.intensity < 0.5) {
      screenShake.intensity = 0;
      screenShake.x = 0;
      screenShake.y = 0;
    }
  }
}

// ============================================================
// 渲染
// ============================================================

function render() {
  ctx.save();
  ctx.translate(screenShake.x, screenShake.y);

  // 背景
  const bgGrad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 0, canvas.width / 2, canvas.height / 2, canvas.width * 0.7);
  bgGrad.addColorStop(0, '#1a1a2e');
  bgGrad.addColorStop(0.5, '#0f0f1a');
  bgGrad.addColorStop(1, '#0a0a12');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);

  drawStars();
  drawGrid();
  drawAmbientGlow();

  // 经验球 - 批量绘制
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#3498db';
  ctx.fillStyle = '#3498db';
  for (let i = 0, len = xpOrbs.length; i < len; i++) {
    const orb = xpOrbs[i];
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, orb.radius, 0, 6.2832);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // 敌人 - 批量绘制
  for (let i = 0, len = enemies.length; i < len; i++) {
    const e = enemies[i];
    if (e.hp <= 0) continue;
    drawEnemy(e);
  }

  // 子弹 - 批量绘制
  ctx.fillStyle = '#f39c12';
  for (let i = 0, len = bullets.length; i < len; i++) {
    const b = bullets[i];
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, 6.2832);
    ctx.fill();
  }

  // 环绕球
  if (weapons.orbit.level > 0) {
    const count = CONFIG.WEAPONS.orbit.count + weapons.orbit.level - 1;
    const radius = CONFIG.WEAPONS.orbit.radius + weapons.orbit.level * 10;
    ctx.fillStyle = CONFIG.WEAPONS.orbit.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = CONFIG.WEAPONS.orbit.color;
    for (let i = 0; i < count; i++) {
      const angle = orbitAngle + (6.2832 / count) * i;
      const bx = player.x + fastCos(angle) * radius;
      const by = player.y + fastSin(angle) * radius;
      ctx.beginPath();
      ctx.arc(bx, by, 8, 0, 6.2832);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  // 玩家轨迹
  for (let i = 0, len = playerTrail.length; i < len; i++) {
    const t = playerTrail[i];
    ctx.globalAlpha = t.life / t.maxLife * 0.3;
    ctx.fillStyle = game.berserkTimer > 0 ? '#e74c3c' : '#2ecc71';
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.radius * (t.life / t.maxLife), 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 玩家
  if (player) drawPlayer();

  // 粒子
  for (let i = 0, len = particles.length; i < len; i++) {
    const p = particles[i];
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 伤害数字
  ctx.textAlign = 'center';
  ctx.font = 'bold 16px Arial';
  for (let i = 0, len = damageNumbers.length; i < len; i++) {
    const d = damageNumbers[i];
    ctx.globalAlpha = d.life / d.maxLife;
    ctx.fillStyle = d.type === 'damage' ? '#e74c3c' : '#2ecc71';
    ctx.fillText(d.value, d.x, d.y);
  }
  ctx.globalAlpha = 1;

  // 大招特效
  if (ultEffect.active) drawUltEffect();

  ctx.restore();
}

function drawEnemy(e) {
  const pulse = Math.sin(game.frameCount * 0.05 + e.pulseOffset) * 0.1 + 1;
  const r = e.radius * pulse;

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(e.rotation);

  ctx.shadowBlur = 20;
  ctx.shadowColor = e.color;

  ctx.beginPath();
  for (let i = 0; i < e.spikes; i++) {
    const angle = (6.2832 / e.spikes) * i;
    const nextAngle = (6.2832 / e.spikes) * (i + 0.5);
    if (i === 0) ctx.moveTo(fastCos(angle) * r, fastSin(angle) * r);
    else ctx.lineTo(fastCos(angle) * r, fastSin(angle) * r);
    ctx.lineTo(fastCos(nextAngle) * r * 0.6, fastSin(nextAngle) * r * 0.6);
  }
  ctx.closePath();

  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  grad.addColorStop(0, e.color);
  grad.addColorStop(0.7, e.color);
  grad.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = e.color;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.arc(0, 0, r * 0.3, 0, 6.2832);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.fill();

  ctx.restore();

  if (e.hpBarType === 'elite') {
    ctx.beginPath();
    ctx.arc(e.x, e.y, r + 8 + Math.sin(game.frameCount * 0.08) * 3, 0, 6.2832);
    ctx.strokeStyle = `rgba(155, 89, 182, ${0.3 + Math.sin(game.frameCount * 0.05) * 0.15})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  drawEnemyHpBar(e);
}

function drawEnemyHpBar(e) {
  const hpPct = e.hp / e.maxHp;
  const alpha = 0.3 + hpPct * 0.5;
  ctx.globalAlpha = alpha;
  const barY = e.y + e.radius + 6;

  switch (e.hpBarType) {
    case 'fast': {
      const w = e.radius * 3, h = 2;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(e.x - w / 2 - 1, barY - 1, w + 2, h + 2);
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(e.x - w / 2, barY, w * hpPct, h);
      break;
    }
    case 'tank': {
      const w = e.radius * 2.2, h = 6;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(e.x - w / 2 - 2, barY - 2, w + 4, h + 4);
      ctx.strokeStyle = '#3498db';
      ctx.lineWidth = 1;
      ctx.strokeRect(e.x - w / 2 - 1, barY - 1, w + 2, h + 2);
      ctx.fillStyle = '#3498db';
      ctx.fillRect(e.x - w / 2, barY, w * hpPct, h);
      break;
    }
    case 'elite': {
      const w = e.radius * 2, h = 5, gap = 2;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
      ctx.fillRect(e.x - w / 2 - 2, barY - 2, w + 4, h * 2 + gap + 4);
      ctx.strokeStyle = '#9b59b6';
      ctx.lineWidth = 1;
      ctx.strokeRect(e.x - w / 2 - 1, barY - 1, w + 2, h * 2 + gap + 2);
      ctx.fillStyle = '#9b59b6';
      ctx.fillRect(e.x - w / 2, barY, w * Math.min(1, hpPct * 2), h);
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(e.x - w / 2, barY + h + gap, w * Math.max(0, hpPct * 2 - 1), h);
      break;
    }
    default: {
      const w = e.radius * 2.5, h = 4;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(e.x - w / 2 - 1, barY - 1, w + 2, h + 2);
      ctx.fillStyle = hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f39c12' : '#e74c3c';
      ctx.fillRect(e.x - w / 2, barY, w * hpPct, h);
    }
  }
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const isBerserk = game.berserkTimer > 0;
  const baseColor = isBerserk ? '#e74c3c' : '#2ecc71';
  const pulse = Math.sin(game.frameCount * 0.08) * 0.05 + 1;

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(playerAngle);

  ctx.beginPath();
  ctx.arc(0, 0, player.radius + 12, 0, 6.2832);
  ctx.strokeStyle = isBerserk ? 'rgba(231, 76, 60, 0.4)' : 'rgba(46, 204, 113, 0.4)';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.lineDashOffset = -game.frameCount * 0.5;
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.shadowBlur = 25;
  ctx.shadowColor = baseColor;

  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = (6.2832 / 6) * i - 1.0472;
    const x = fastCos(angle) * player.radius * pulse;
    const y = fastSin(angle) * player.radius * pulse;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();

  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, player.radius);
  grad.addColorStop(0, isBerserk ? '#ff6b6b' : '#6bff9e');
  grad.addColorStop(0.5, baseColor);
  grad.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = baseColor;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.arc(0, 0, player.radius * 0.4, 0, 6.2832);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(player.radius * 0.8, 0);
  ctx.lineTo(player.radius * 1.5, -4);
  ctx.lineTo(player.radius * 1.5, 4);
  ctx.closePath();
  ctx.fillStyle = baseColor;
  ctx.fill();

  ctx.restore();

  if (isBerserk) {
    ctx.fillStyle = '#ff6b6b';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#e74c3c';
    for (let i = 0; i < 8; i++) {
      const angle = (6.2832 / 8) * i + game.frameCount * 0.05;
      const dist = player.radius + 15 + Math.sin(game.frameCount * 0.1 + i) * 5;
      ctx.beginPath();
      ctx.arc(player.x + fastCos(angle) * dist, player.y + fastSin(angle) * dist, 3, 0, 6.2832);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
}

function drawStars() {
  const time = game.frameCount * 0.016;
  stars.forEach(star => {
    const twinkle = Math.sin(time * star.twinkleSpeed * 60 + star.twinkleOffset) * 0.3 + 0.7;
    ctx.globalAlpha = star.alpha * twinkle;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
    
    // 大星星添加十字光芒
    if (star.size > 1.8) {
      ctx.globalAlpha = star.alpha * twinkle * 0.3;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(star.x - star.size * 2, star.y);
      ctx.lineTo(star.x + star.size * 2, star.y);
      ctx.moveTo(star.x, star.y - star.size * 2);
      ctx.lineTo(star.x, star.y + star.size * 2);
      ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
}

function drawAmbientGlow() {
  ambientGlows.forEach(glow => {
    // 缓慢移动
    glow.angle += glow.speed * 0.005;
    glow.x += Math.cos(glow.angle) * glow.speed * 0.2;
    glow.y += Math.sin(glow.angle) * glow.speed * 0.2;
    
    // 边界循环
    if (glow.x < -glow.radius) glow.x = canvas.width + glow.radius;
    if (glow.x > canvas.width + glow.radius) glow.x = -glow.radius;
    if (glow.y < -glow.radius) glow.y = canvas.height + glow.radius;
    if (glow.y > canvas.height + glow.radius) glow.y = -glow.radius;
    
    const grad = ctx.createRadialGradient(glow.x, glow.y, 0, glow.x, glow.y, glow.radius);
    grad.addColorStop(0, glow.color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(glow.x - glow.radius, glow.y - glow.radius, glow.radius * 2, glow.radius * 2);
  });
}

function drawGrid() {
  const gridSize = 60;
  const pulse = Math.sin(game.frameCount * 0.02) * 0.01 + 0.04;
  
  ctx.strokeStyle = `rgba(100, 100, 180, ${pulse})`;
  ctx.lineWidth = 0.5;
  
  // 绘制主网格
  for (let x = 0; x <= canvas.width; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
  
  // 绘制交叉点装饰
  ctx.fillStyle = `rgba(100, 100, 180, ${pulse * 0.5})`;
  for (let x = 0; x <= canvas.width; x += gridSize) {
    for (let y = 0; y <= canvas.height; y += gridSize) {
      ctx.beginPath();
      ctx.arc(x, y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawUltEffect() {
  // 阶段0: 蓄力 - 能量汇聚光环
  if (ultEffect.phase === 0) {
    const t = ultEffect.timer / 25;
    const gatherRadius = 120 * (1 - t);

    // 旋转能量环
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(ultEffect.timer * 0.15);

    for (let ring = 0; ring < 3; ring++) {
      const r = gatherRadius + ring * 15;
      const alpha = 0.3 + t * 0.5;
      const color = ['#f1c40f', '#e67e22', '#e74c3c'][ring];

      ctx.beginPath();
      ctx.arc(0, 0, r, 0, 6.2832);
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha * (1 - ring * 0.25);
      ctx.lineWidth = 3 - ring;
      ctx.setLineDash([8 + ring * 4, 6 + ring * 3]);
      ctx.lineDashOffset = -ultEffect.timer * (2 + ring);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 中心能量球
    const coreSize = 5 + t * 20;
    const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, coreSize);
    coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
    coreGrad.addColorStop(0.3, 'rgba(241, 196, 15, 0.6)');
    coreGrad.addColorStop(1, 'rgba(241, 196, 15, 0)');
    ctx.globalAlpha = 0.8 + t * 0.2;
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(0, 0, coreSize, 0, 6.2832);
    ctx.fill();

    ctx.restore();

    // 蓄力粒子
    for (let i = 0, len = ultEffect.particles.length; i < len; i++) {
      const p = ultEffect.particles[i];
      if (p.targetX === undefined) continue;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, 6.2832);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    // 蓄力全屏闪光
    if (ultEffect.timer > 18) {
      const flashAlpha = (ultEffect.timer - 18) / 7 * 0.15;
      ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
      ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);
    }
  }

  // 阶段1: 爆发 + 冲击波
  if (ultEffect.phase === 1) {
    // 冲击波
    for (let i = 0, len = ultEffect.shockwaves.length; i < len; i++) {
      const sw = ultEffect.shockwaves[i];
      if (sw.delay > 0 || sw.radius <= 0) continue;

      ctx.beginPath();
      ctx.arc(player.x, player.y, sw.radius, 0, 6.2832);
      ctx.strokeStyle = sw.color;
      ctx.globalAlpha = sw.alpha * 0.8;
      ctx.lineWidth = 8 - (sw.radius / sw.maxRadius) * 6;
      ctx.shadowBlur = 20;
      ctx.shadowColor = sw.color;
      ctx.stroke();

      // 内圈光晕 - 用粗线替代昂贵的RadialGradient
      ctx.beginPath();
      ctx.arc(player.x, player.y, sw.radius, 0, 6.2832);
      ctx.strokeStyle = sw.color;
      ctx.globalAlpha = sw.alpha * 0.12;
      ctx.lineWidth = 30;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    // 爆发粒子 - 批量绘制，减少shadowBlur切换
    for (let i = 0, len = ultEffect.particles.length; i < len; i++) {
      const p = ultEffect.particles[i];
      if (p.targetX !== undefined) continue;
      ctx.globalAlpha = Math.min(1, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 爆发瞬间全屏白闪
    if (ultEffect.timer < 8) {
      const flashAlpha = (1 - ultEffect.timer / 8) * 0.4;
      ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
      ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);
    }

    // 地面裂纹效果
    if (ultEffect.timer > 5 && ultEffect.timer < 40) {
      const crackAlpha = Math.max(0, 1 - (ultEffect.timer - 5) / 35) * 0.3;
      ctx.strokeStyle = `rgba(241, 196, 15, ${crackAlpha})`;
      ctx.lineWidth = 2;

      const crackLen = 50 + ultEffect.timer * 3;
      const segLen = crackLen / 5;

      for (let i = 0; i < ultEffect.crackAngles.length; i++) {
        const segments = ultEffect.crackAngles[i];
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        let cx = player.x, cy = player.y;
        for (let j = 0; j < segments.length; j++) {
          cx += fastCos(segments[j]) * segLen;
          cy += fastSin(segments[j]) * segLen;
          ctx.lineTo(cx, cy);
        }
        ctx.stroke();
      }
    }
  }
}

// ============================================================
// HUD更新
// ============================================================

function updateHUD() {
  if (!player) return;

  const hpPct = Math.max(0, player.hp / player.maxHp * 100);
  DOM.hpBar.style.width = hpPct + '%';
  DOM.hpTxt.textContent = `${Math.ceil(player.hp)}/${player.maxHp}`;

  const xpPct = Math.min(100, game.xp / game.xpToNext * 100);
  DOM.xpBar.style.width = xpPct + '%';
  DOM.xpTxt.textContent = `${Math.floor(game.xp)}/${game.xpToNext}`;

  DOM.hudTime.textContent = formatTime(game.time);
  DOM.hudLv.textContent = `Lv.${game.level}`;
  DOM.hudKills.textContent = `击杀: ${game.kills}`;

  const activeWeapons = [];
  if (weapons.bullet.level > 0) activeWeapons.push(CONFIG.WEAPONS.bullet.icon);
  if (weapons.orbit.level > 0) activeWeapons.push(CONFIG.WEAPONS.orbit.icon);
  if (weapons.laser.level > 0) activeWeapons.push(CONFIG.WEAPONS.laser.icon);
  if (weapons.area.level > 0) activeWeapons.push(CONFIG.WEAPONS.area.icon);
  DOM.hudWep.textContent = `武器: ${activeWeapons.length > 0 ? activeWeapons.join(' ') : '-'}`;

  DOM.hudUlt.textContent = `大招: ${game.ultCharge}/${CONFIG.ULTIMATE.maxCharge}`;
  if (game.ultCharge >= CONFIG.ULTIMATE.maxCharge) {
    DOM.ultBtn.classList.add('ready');
    DOM.ultBtn.style.display = 'flex';
  } else {
    DOM.ultBtn.classList.remove('ready');
    DOM.ultBtn.style.display = game.ultCharge > 0 ? 'flex' : 'none';
  }

  if (game.berserkTimer > 0) {
    DOM.hudBerserk.style.display = 'block';
    DOM.hudBerserk.textContent = `狂暴: ${game.berserkTimer.toFixed(1)}s`;
  }
}

// ============================================================
// 工具函数
// ============================================================

function formatTime(frames) {
  const seconds = Math.floor(frames / 60);
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pointToLineDistance(px, py, x1, y1, x2, y2) {
  const A = px - x1;
  const B = py - y1;
  const C = x2 - x1;
  const D = y2 - y1;
  const dot = A * C + B * D;
  const lenSq = C * C + D * D;
  let param = lenSq !== 0 ? dot / lenSq : -1;
  param = Math.max(0, Math.min(1, param));
  const xx = x1 + param * C;
  const yy = y1 + param * D;
  return Math.hypot(px - xx, py - yy);
}

function mobUlt() {
  if (game.state === 'playing') useUltimate();
}

// 移动端控制信息更新
function updateCtrlInfo() {
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  if (isMobile) {
    DOM.ctrlInfo.innerHTML = '👈 左侧虚拟摇杆移动 | 👉 右侧点击大招<br>武器自动攻击 · 收集经验升级 · 击杀充能大招';
  }
}
updateCtrlInfo();

// 初始化
game.lastTime = performance.now();
</script>
