<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>生存幸存者</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:'Segoe UI','Microsoft YaHei',sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;padding:10px 15px;display:none;justify-content:space-between;align-items:flex-start}
.hud-left,.hud-right{display:flex;flex-direction:column;gap:5px}
.hud-bar{width:180px;height:12px;background:rgba(0,0,0,0.6);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)}
.hud-fill{height:100%;transition:width .2s;border-radius:6px}
.hp-fill{background:linear-gradient(90deg,#e74c3c,#ff6b6b)}
.xp-fill{background:linear-gradient(90deg,#3498db,#74b9ff)}
.hud-bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.hud-stat{font-size:11px;color:#aaa;font-weight:600;text-shadow:0 1px 2px #000}
.hud-time{font-size:22px;color:#fff;font-weight:900;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.hud-level{font-size:13px;color:#f1c40f;font-weight:700}

/* Mobile HUD buttons */
#ultBtn{position:fixed;bottom:60px;right:30px;width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#f1c40f,#e67e22);border:3px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:900;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 4px 15px rgba(241,196,15,.4)}
#ultBtn.ready{animation:ultPulse .8s infinite alternate;border-color:#2ecc71;box-shadow:0 4px 25px rgba(46,204,113,.6)}
@keyframes ultPulse{from{transform:scale(1)}to{transform:scale(1.1)}}

/* Virtual Joystick */
#joystick{position:fixed;bottom:40px;left:40px;width:130px;height:130px;display:none;z-index:20}
#joyBase{width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15)}
#joyKnob{width:50px;height:50px;border-radius:50%;background:rgba(52,152,219,.5);border:2px solid rgba(52,152,219,.8);position:absolute;top:40px;left:40px;pointer-events:none;transition:none}

/* Start Screen */
#start-screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#1a1a3e 0%,#0a0a12 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#start-screen h1{font-size:clamp(36px,6vw,64px);font-weight:900;background:linear-gradient(135deg,#3498db,#e74c3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:4px}
#start-screen .sub{font-size:13px;color:#666;margin-bottom:35px;letter-spacing:2px}
#start-screen .ctrl{color:#555;font-size:12px;margin-bottom:30px;text-align:center;line-height:2.2}
#start-screen kbd{background:#1a1a2e;padding:3px 10px;border-radius:4px;border:1px solid #333;color:#ccc;font-family:inherit;font-size:11px}
.btn-main{padding:14px 55px;font-size:18px;font-weight:700;background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;border:none;border-radius:12px;cursor:pointer;letter-spacing:4px;transition:all .3s;box-shadow:0 4px 20px rgba(52,152,219,.3)}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(52,152,219,.5)}

/* Upgrade Menu */
#upgrade-menu{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50}
#upgrade-menu.on{display:flex}
#upgrade-menu h2{color:#f1c40f;font-size:26px;margin-bottom:6px;letter-spacing:4px}
#upgrade-menu .ulv{color:#777;font-size:13px;margin-bottom:25px}
.ucards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ucard{width:170px;padding:18px 12px;background:linear-gradient(135deg,#141428,#1a1a35);border:2px solid #2a2a4a;border-radius:12px;text-align:center;cursor:pointer;transition:all .3s}
.ucard:hover{border-color:#f1c40f;transform:translateY(-4px);box-shadow:0 8px 25px rgba(241,196,15,.25)}
.ucard .ui{font-size:34px;margin-bottom:8px}
.ucard .un{color:#fff;font-size:14px;font-weight:700;margin-bottom:5px}
.ucard .ud{color:#777;font-size:11px;line-height:1.5}
.ucard .ul{color:#f1c40f;font-size:10px;margin-top:6px;font-weight:600}

/* Death Screen */
#death-screen{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:60}
#death-screen.on{display:flex}
#death-screen h1{font-size:44px;color:#e74c3c;font-weight:900;margin-bottom:18px;text-shadow:0 0 30px rgba(231,76,60,.4)}
.dstats{display:flex;gap:35px;margin-bottom:28px}
.ds{text-align:center}
.ds .dv{font-size:28px;font-weight:900;color:#fff}
.ds .dl{font-size:11px;color:#777;margin-top:3px}
.btn-red{padding:12px 45px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;border:none;border-radius:10px;cursor:pointer;letter-spacing:3px;transition:all .3s;box-shadow:0 4px 20px rgba(231,76,60,.3)}
.btn-red:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(231,76,60,.5)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div class="hud-left">
      <div class="hud-bar" style="position:relative"><div class="hud-fill hp-fill" id="hpBar"></div><div class="hud-bar-text" id="hpTxt">100/100</div></div>
      <div class="hud-bar" style="position:relative"><div class="hud-fill xp-fill" id="xpBar"></div><div class="hud-bar-text" id="xpTxt">0/20</div></div>
    </div>
    <div class="hud-time" id="hudTime">0:00</div>
    <div class="hud-right">
      <div class="hud-level" id="hudLv">Lv.1</div>
      <div class="hud-stat" id="hudKills">击杀: 0</div>
      <div class="hud-stat" id="hudWep">武器: -</div>
      <div class="hud-stat" id="hudUlt" style="color:#f1c40f">大招: 0/50</div>
      <div class="hud-stat" id="hudBerserk" style="color:#e74c3c;display:none">狂暴: 0s</div>
    </div>
  </div>
</div>

<!-- 移动端虚拟摇杆 -->
<div id="joystick"><div id="joyBase"><div id="joyKnob"></div></div></div>
<button id="ultBtn" ontouchstart="mobUlt()" onclick="mobUlt()">大招</button>

<div id="start-screen">
  <h1>生存幸存者</h1>
  <div class="sub">活下来，击败一切</div>
  <div class="ctrl" id="ctrlInfo">
    <kbd>W A S D</kbd> / <kbd>方向键</kbd> 移动 &nbsp;|&nbsp; <kbd>空格</kbd> 释放大招<br>
    武器自动攻击 · 收集经验升级 · 击杀充能大招
  </div>
  <button class="btn-main" onclick="startGame()">开 始 游 戏</button>
</div>

<div id="upgrade-menu">
  <h2> 升 级</h2>
  <div class="ulv" id="upLv"></div>
  <div class="ucards" id="upCards"></div>
</div>

<div id="death-screen">
  <h1>阵 亡</h1>
  <div class="dstats">
    <div class="ds"><div class="dv" id="dTime">0:00</div><div class="dl">存活时间</div></div>
    <div class="ds"><div class="dv" id="dKills">0</div><div class="dl">击杀数</div></div>
    <div class="ds"><div class="dv" id="dLv">1</div><div class="dl">等级</div></div>
  </div>
  <button class="btn-red" onclick="restartGame()">再 来 一 次</button>
</div>

<script>
// ============================================================
//  平台检测 & 初始化
// ============================================================
const isMobile=/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||('ontouchstart' in window&&innerWidth<800);
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight}resize();addEventListener('resize',resize);

// 移动端提示
if(isMobile){
  document.getElementById('ctrlInfo').innerHTML='左手虚拟摇杆移动 &nbsp;|&nbsp; 右下角按钮释放大招<br>武器自动攻击 · 收集经验升级 · 击杀充能大招';
}

// ============================================================
//  武器数据库
// ============================================================
const WDB=[
  {id:'bullet',name:'魔力弹',icon:'\u{1F535}',desc:'向前方发射魔法弹',color:'#3498db',maxLv:8,
   stats:lv=>({dmg:10+lv*3,spd:6,range:300,cd:.6-lv*.04,count:1+Math.floor(lv/3),pierce:1+Math.floor(lv/4),spread:.15})},
  {id:'fire',name:'火焰环',icon:'\u{1F525}',desc:'环绕自身的火焰球',color:'#e74c3c',maxLv:8,
   stats:lv=>({dmg:8+lv*2,spd:0,range:55+lv*10,cd:.05,count:2+Math.floor(lv/2),pierce:999,spread:0,orbit:true})},
  {id:'lightning',name:'雷击',icon:'\u26A1',desc:'随机劈落闪电',color:'#f1c40f',maxLv:8,
   stats:lv=>({dmg:15+lv*4,spd:0,range:260,cd:1.2-lv*.08,count:1+Math.floor(lv/3),pierce:1,spread:0,aoe:35+lv*5})},
  {id:'ice',name:'冰锥',icon:'\u2744',desc:'扇形发射冰锥，减速敌人',color:'#74b9ff',maxLv:8,
   stats:lv=>({dmg:7+lv*2,spd:7,range:260,cd:.8-lv*.05,count:3+Math.floor(lv/2),pierce:1,spread:.4,slow:.3+lv*.05})},
  {id:'holy',name:'圣十字',icon:'\u271D',desc:'向前方发射十字光弹',color:'#ffeaa7',maxLv:8,
   stats:lv=>({dmg:12+lv*3,spd:5,range:360,cd:1-lv*.06,count:1+Math.floor(lv/4),pierce:2+Math.floor(lv/3),spread:.08})},
  {id:'poison',name:'毒雾',icon:'\u2620',desc:'持续释放剧毒区域',color:'#00b894',maxLv:8,
   stats:lv=>({dmg:4+lv*2,spd:0,range:120+lv*20,cd:.03,count:1,pierce:999,spread:0,aoe:100+lv*15,ground:true})},
  {id:'star',name:'飞星',icon:'\u2B50',desc:'发射旋转追踪飞星',color:'#f39c12',maxLv:8,
   stats:lv=>({dmg:9+lv*3,spd:5,range:350,cd:.5-lv*.04,count:2+Math.floor(lv/2),pierce:2+Math.floor(lv/3),spread:.3,homing:true})},
  {id:'thunder',name:'雷霆链',icon:'\u{1F329}',desc:'闪电链弹射多个敌人',color:'#a29bfe',maxLv:8,
   stats:lv=>({dmg:11+lv*3,spd:8,range:300,cd:.9-lv*.06,count:1+Math.floor(lv/4),pierce:3+lv,spread:.1,chain:true})},
  {id:'tornado',name:'龙卷风',icon:'\u{1F32A}',desc:'召唤前进的龙卷风',color:'#81ecec',maxLv:8,
   stats:lv=>({dmg:6+lv*2,spd:2,range:400,cd:1.5-lv*.1,count:1,pierce:999,spread:0,aoe:40+lv*8,push:true})},
  {id:'meteor',name:'陨石',icon:'\u2604',desc:'随机位置坠落陨石',color:'#fdcb6e',maxLv:8,
   stats:lv=>({dmg:20+lv*5,spd:0,range:280,cd:2-lv*.12,count:1+Math.floor(lv/3),pierce:1,spread:0,aoe:50+lv*10,fall:true})},
  {id:'laser',name:'激光束',icon:'\u{1F534}',desc:'发射持续激光扫射',color:'#ff6b6b',maxLv:8,
   stats:lv=>({dmg:3+lv,spd:0,range:350,cd:2.5-lv*.15,count:1,pierce:999,spread:0,aoe:20+lv*5,beam:true})},
  {id:'shuriken',name:'手里剑',icon:'\u{1F338}',desc:'快速投掷手里剑',color:'#fd79a8',maxLv:8,
   stats:lv=>({dmg:6+lv*2,spd:8,range:280,cd:.35-lv*.03,count:1+Math.floor(lv/3),pierce:1+Math.floor(lv/3),spread:.2,spin:true})},
];
const START_WEPS=[0,1,2,3,4]; // 不含毒雾

// ============================================================
//  被动道具数据库
// ============================================================
const ITEMS=[
  {id:'cloak',name:'暗影斗篷',icon:'\u{1F9E5}',desc:'受伤后短暂隐身',maxLv:3,fn:p=>{p.invBonus=(p.invBonus||0)+1.5}},
  {id:'thorns',name:'荆棘之甲',icon:'\u{1F339}',desc:'反弹受到伤害的20%',maxLv:5,fn:p=>{p.reflect=(p.reflect||0)+.2}},
  {id:'vampiric',name:'嗜血之刃',icon:'\u{1FA78}',desc:'击杀恢复5%最大生命',maxLv:3,fn:p=>{p.lifesteal=(p.lifesteal||0)+.05}},
  {id:'timeWarp',name:'时间扭曲',icon:'\u23F3',desc:'所有武器冷却-10%',maxLv:5,fn:p=>{p.cdRed=(p.cdRed||0)+.1}},
  {id:'magnet',name:'强力磁铁',icon:'\u{1F9F2}',desc:'拾取范围翻倍',maxLv:3,fn:p=>{p.mag*=(1+1)}},
  {id:'critGem',name:'暴击宝石',icon:'\u{1F48E}',desc:'暴击伤害+50%',maxLv:3,fn:p=>{p.critDmg=(p.critDmg||0)+.5}},
  {id:'hpRing',name:'生命之戒',icon:'\u{1F48D}',desc:'最大生命+30',maxLv:5,fn:p=>{p.mhp+=30;p.hp+=30}},
  {id:'spdBoots',name:'疾风靴',icon:'\u{1F45F}',desc:'移动速度+20%',maxLv:3,fn:p=>{p.spd*=1.2}},
];

// ============================================================
//  升级选项
// ============================================================
const UPGRADES=[
  {id:'mhp',name:'最大生命',icon:'\u2764',desc:'最大HP +25',fn:p=>{p.mhp+=25;p.hp+=25}},
  {id:'spd',name:'移动加速',icon:'\u{1F3C3}',desc:'移速 +15%',fn:p=>{p.spd*=1.15}},
  {id:'arm',name:'护甲',icon:'\u{1F6E1}',desc:'受到伤害 -10%',fn:p=>{p.arm+=.1}},
  {id:'reg',name:'生命恢复',icon:'\u{1F49A}',desc:'每秒恢复HP',fn:p=>{p.reg+=1}},
  {id:'mag',name:'磁力',icon:'\u{1F9F2}',desc:'拾取范围 +50%',fn:p=>{p.mag*=1.5}},
  {id:'lck',name:'幸运',icon:'\u{1F340}',desc:'暴击率 +10%',fn:p=>{p.crit+=.1}},
  {id:'multi',name:'多重射击',icon:'\u{1F531}',desc:'武器弹数 +1',fn:p=>{p.wBonus+=1}},
];

// ============================================================
//  敌人定义 - 精美建模
// ============================================================
const EDEF={
  // 普通战士 - 红色圆形带护甲和愤怒表情
  basic:{hp:18,spd:1.3,sz:14,color:'#e74c3c',xp:3,dmg:8,
    draw:(c,e)=>{
      // 外护甲环
      c.beginPath();c.arc(e.x,e.y,e.sz+2,0,Math.PI*2);c.strokeStyle='rgba(255,150,150,.35)';c.lineWidth=2;c.stroke();
      // 主体
      c.beginPath();c.arc(e.x,e.y,e.sz,0,Math.PI*2);
      const bg=c.createRadialGradient(e.x-e.sz*.3,e.y-e.sz*.3,0,e.x,e.y,e.sz);
      bg.addColorStop(0,'#ff8a80');bg.addColorStop(1,'#c0392b');c.fillStyle=bg;c.fill();
      // 暗色核心
      c.beginPath();c.arc(e.x,e.y+e.sz*.15,e.sz*.55,0,Math.PI*2);c.fillStyle='rgba(0,0,0,.2)';c.fill();
      // 头盔/护额
      c.fillStyle='#b03a2e';c.fillRect(e.x-e.sz*.7,e.y-e.sz*.85,e.sz*1.4,e.sz*.35);
      c.fillStyle='#f39c12';c.fillRect(e.x-e.sz*.2,e.y-e.sz*.9,e.sz*.4,e.sz*.2);
      // 愤怒眉毛
      c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();
      c.moveTo(e.x-e.sz*.45,e.y-e.sz*.35);c.lineTo(e.x-e.sz*.15,e.y-e.sz*.25);c.stroke();
      c.beginPath();c.moveTo(e.x+e.sz*.45,e.y-e.sz*.35);c.lineTo(e.x+e.sz*.15,e.y-e.sz*.25);c.stroke();
      // 眼睛
      c.fillStyle='#fff';c.beginPath();c.arc(e.x-e.sz*.25,e.y-e.sz*.1,3.5,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(e.x+e.sz*.25,e.y-e.sz*.1,3.5,0,Math.PI*2);c.fill();
      c.fillStyle='#c0392b';c.beginPath();c.arc(e.x-e.sz*.2,e.y-e.sz*.08,2,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(e.x+e.sz*.3,e.y-e.sz*.08,2,0,Math.PI*2);c.fill();
      // 嘴巴（龇牙）
      c.fillStyle='#fff';c.fillRect(e.x-e.sz*.3,e.y+e.sz*.3,e.sz*.6,e.sz*.15);
      c.strokeStyle='#8b0000';c.lineWidth=1;c.strokeRect(e.x-e.sz*.3,e.y+e.sz*.3,e.sz*.6,e.sz*.15)
    }},
  // 快速 - 橙色箭头带尾翼
  fast:{hp:10,spd:2.8,sz:10,color:'#e67e22',xp:2,dmg:5,
    draw:(c,e)=>{
      const a=Math.atan2(G.P.y-e.y,G.P.x-e.x);c.save();c.translate(e.x,e.y);c.rotate(a);
      // 尾翼
      c.fillStyle='#d35400';c.beginPath();c.moveTo(-e.sz*.4,0);c.lineTo(-e.sz*1.1,-e.sz*.8);c.lineTo(-e.sz*.7,0);c.lineTo(-e.sz*1.1,e.sz*.8);c.closePath();c.fill();
      // 主体
      c.beginPath();c.moveTo(e.sz,0);c.lineTo(-e.sz*.5,-e.sz*.6);c.lineTo(-e.sz*.3,0);c.lineTo(-e.sz*.5,e.sz*.6);c.closePath();
      const fg=c.createLinearGradient(-e.sz,0,e.sz,0);fg.addColorStop(0,'#e67e22');fg.addColorStop(1,'#f39c12');c.fillStyle=fg;c.fill();
      // 核心光点
      c.beginPath();c.arc(e.sz*.2,0,e.sz*.3,0,Math.PI*2);c.fillStyle='rgba(255,255,255,.25)';c.fill();
      // 眼睛
      c.fillStyle='#fff';c.beginPath();c.arc(e.sz*.4,0,2.5,0,Math.PI*2);c.fill();
      c.fillStyle='#000';c.beginPath();c.arc(e.sz*.45,0,1.2,0,Math.PI*2);c.fill();
      c.restore()
    }},
  // 坦克 - 紫色六边形重甲
  tank:{hp:65,spd:.8,sz:22,color:'#8e44ad',xp:8,dmg:15,
    draw:(c,e)=>{
      // 外护甲环
      c.beginPath();c.arc(e.x,e.y,e.sz+5,0,Math.PI*2);c.strokeStyle='rgba(180,100,255,.3)';c.lineWidth=2;c.stroke();
      // 外六边形
      c.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;c.lineTo(e.x+e.sz*Math.cos(a),e.y+e.sz*Math.sin(a))}
      c.closePath();const tg=c.createRadialGradient(e.x,e.y,0,e.x,e.y,e.sz);tg.addColorStop(0,'#bb8fce');tg.addColorStop(1,'#6c3483');c.fillStyle=tg;c.fill();
      // 内六边形
      c.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i;c.lineTo(e.x+e.sz*.65*Math.cos(a),e.y+e.sz*.65*Math.sin(a))}
      c.closePath();c.fillStyle='rgba(0,0,0,.2)';c.fill();
      // 肩甲装饰
      c.fillStyle='#7d3c98';c.fillRect(e.x-e.sz*.9,e.y-e.sz*.15,e.sz*.3,e.sz*.3);
      c.fillRect(e.x+e.sz*.6,e.y-e.sz*.15,e.sz*.3,e.sz*.3);
      // 独眼
      c.fillStyle='#fff';c.beginPath();c.arc(e.x,e.y,6,0,Math.PI*2);c.fill();
      c.fillStyle='#c0392b';c.beginPath();c.arc(e.x,e.y,3.5,0,Math.PI*2);c.fill();
      c.fillStyle='#000';c.beginPath();c.arc(e.x,e.y,1.8,0,Math.PI*2);c.fill()
    }},
  // 射手 - 绿色菱形带瞄准器
  shooter:{hp:22,spd:1.5,sz:15,color:'#2ecc71',xp:5,dmg:10,shoots:true,shootCd:2.2,

// 移动端虚拟摇杆
let joyActive=false,joyX=0,joyY=0;
const joyEl=document.getElementById('joystick'),joyKnob=document.getElementById('joyKnob'),joyBase=document.getElementById('joyBase');
const J_R=65,K_R=25;
function joyHandleStart(ex,ey){joyActive=true;joyUpdate(ex,ey)}
function joyHandleMove(ex,ey){if(!joyActive)return;joyUpdate(ex,ey)}
function joyHandleEnd(){joyActive=false;joyX=0;joyY=0;joyKnob.style.top='40px';joyKnob.style.left='40px'}
function joyUpdate(ex,ey){
  const r=joyBase.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=ex-cx,dy=ey-cy;const d=Math.sqrt(dx*dx+dy*dy);
  if(d>J_R){dx=dx/d*J_R;dy=dy/d*J_R}
  joyX=dx/J_R;joyY=dy/J_R;
  joyKnob.style.left=(40+dx)+'px';joyKnob.style.top=(40+dy)+'px'
}
if(isMobile){
  joyEl.style.display='block';document.getElementById('ultBtn').style.display='flex';
  joyEl.addEventListener('touchstart',e=>{e.preventDefault();joyHandleStart(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
  joyEl.addEventListener('touchmove',e=>{e.preventDefault();joyHandleMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
  joyEl.addEventListener('touchend',e=>{e.preventDefault();joyHandleEnd()},{passive:false});
}

function fireW(w){
  const s=w.stats(w.lv),p=G.P,cnt=s.count+(p.wBonus||0);
  // 应用冷却缩减
  let cdMul=1;if(p.cdRed)cdMul=Math.max(.2,1-p.cdRed);
  if(s.orbit)return;
  // 毒雾地面
  if(s.ground){G.proj.push({x:p.x,y:p.y,vx:0,vy:0,dmg:s.dmg,range:s.range,aoe:s.aoe,c:w.color,life:3,pierce:s.pierce,ground:true,slow:s.slow||0,wid:w.id,sz:s.aoe/2});return}
  // 雷击AOE
  if(s.aoe&&!s.spread&&!s.fall&&!s.beam){
    const tgts=G.enemies.filter(e=>e.hp>0).sort((a,b)=>dist(a.x,a.y,p.x,p.y)-dist(b.x,b.y,p.x,p.y)).slice(0,s.count);
    tgts.forEach(t=>{G.proj.push({x:t.x,y:t.y,vx:0,vy:0,dmg:s.dmg,range:s.range,aoe:s.aoe,c:w.color,life:.3,pierce:1,aoeHit:true,slow:0,wid:w.id,sz:8});
      for(let i=0;i<8;i++)spawnP(t.x,t.y,w.color,3)});return}
  // 飞星追踪
  if(s.homing){
    const tgts=G.enemies.filter(e=>e.hp>0).sort((a,b)=>dist(a.x,a.y,p.x,p.y)-dist(b.x,b.y,p.x,p.y)).slice(0,cnt);
    tgts.forEach(t=>{const a=Math.atan2(t.y-p.y,t.x-p.x);
      G.proj.push({x:p.x,y:p.y,vx:Math.cos(a)*s.spd,vy:Math.sin(a)*s.spd,dmg:s.dmg,range:s.range,aoe:0,c:w.color,life:3,pierce:s.pierce,slow:0,wid:w.id,sz:6,hits:new Set,homing:true})});
    return}
  // 陨石坠落
  if(s.fall){
    const tgts=G.enemies.filter(e=>e.hp>0&&dist(e.x,e.y,p.x,p.y)<s.range);
    const targets=tgts.length>0?tgts:[];
    for(let i=0;i<cnt;i++){
      const tx=targets.length>0?targets[i%targets.length].x+(Math.random()-.5)*40:p.x+(Math.random()-.5)*s.range;
      const ty=targets.length>0?targets[i%targets.length].y+(Math.random()-.5)*40:p.y+(Math.random()-.5)*s.range;
      G.proj.push({x:tx,y:ty-500,vx:0,vy:8,dmg:s.dmg,range:s.range,aoe:s.aoe,c:w.color,life:2,pierce:s.pierce,fall:true,wid:w.id,sz:10,hits:new Set})}
    return}
  // 激光束
  if(s.beam){
    let ax=0,ay=-1,nd=Infinity;
    G.enemies.forEach(e=>{if(e.hp<=0)return;const d=dist(e.x,e.y,p.x,p.y);if(d<nd&&d<s.range){nd=d;ax=e.x-p.x;ay=e.y-p.y}});
    const ba=Math.atan2(ay,ax);
    G.proj.push({x:p.x,y:p.y,vx:Math.cos(ba)*15,vy:Math.sin(ba)*15,dmg:s.dmg,range:s.range,aoe:s.aoe,c:w.color,life:1.5,pierce:999,beam:true,wid:w.id,sz:4,hits:new Set});
    return}
  // 龙卷风
  if(s.push){
    let ax=0,ay=-1;
    G.enemies.forEach(e=>{if(e.hp<=0)return;const d=dist(e.x,e.y,p.x,p.y);if(d<s.range){ax=e.x-p.x;ay=e.y-p.y}});
    const ta=Math.atan2(ay,ax)+(Math.random()-.5)*.5;
    G.proj.push({x:p.x,y:p.y,vx:Math.cos(ta)*s.spd,vy:Math.sin(ta)*s.spd,dmg:s.dmg,range:s.range,aoe:s.aoe,c:w.color,life:4,pierce:s.pierce,push:true,wid:w.id,sz:s.aoe/2,hits:new Set});
    return}
  // 雷霆链
  if(s.chain){
    let ax=0,ay=-1,nd=Infinity;
    G.enemies.forEach(e=>{if(e.hp<=0)return;const d=dist(e.x,e.y,p.x,p.y);if(d<nd&&d<s.range){nd=d;ax=e.x-p.x;ay=e.y-p.y}});
    const ca=Math.atan2(ay,ax);
    for(let i=0;i<cnt;i++){const sp=(Math.random()-.5)*s.spread*2,ag=ca+sp;
      G.proj.push({x:p.x,y:p.y,vx:Math.cos(ag)*s.spd,vy:Math.sin(ag)*s.spd,dmg:s.dmg,range:s.range,aoe:30,c:w.color,life:s.range/s.spd,pierce:s.pierce,chain:true,slow:0,wid:w.id,sz:5,hits:new Set})}
    return}
  // 手里剑（快速旋转）
  if(s.spin){
    let ax2=0,ay2=-1,nd2=Infinity;
    G.enemies.forEach(e=>{if(e.hp<=0)return;const d=dist(e.x,e.y,p.x,p.y);if(d<nd2&&d<s.range){nd2=d;ax2=e.x-p.x;ay2=e.y-p.y}});
    const aa2=Math.atan2(ay2,ax2);
    for(let i=0;i<cnt;i++){const sp=(Math.random()-.5)*s.spread*2,ag=aa2+sp+(cnt>1?(i/(cnt-1)-.5)*s.spread*2:0);
      G.proj.push({x:p.x,y:p.y,vx:Math.cos(ag)*s.spd,vy:Math.sin(ag)*s.spd,dmg:s.dmg,range:s.range,aoe:0,c:w.color,life:s.range/s.spd,pierce:s.pierce,slow:0,wid:w.id,sz:6,hits:new Set,spin:true,rot:Math.random()*6.28})}
    return}
  // 默认投射物
  let ax=0,ay=-1,nd=Infinity;
  G.enemies.forEach(e=>{if(e.hp<=0)return;const d=dist(e.x,e.y,p.x,p.y);if(d<nd&&d<s.range){nd=d;ax=e.x-p.x;ay=e.y-p.y}});
  const aa=Math.atan2(ay,ax);
  for(let i=0;i<cnt;i++){const sp=(Math.random()-.5)*s.spread*2,ag=aa+sp+(cnt>1?(i/(cnt-1)-.5)*s.spread*2:0);
    G.proj.push({x:p.x,y:p.y,vx:Math.cos(ag)*s.spd,vy:Math.sin(ag)*s.spd,dmg:s.dmg,range:s.range,aoe:s.aoe||0,c:w.color,life:s.range/s.spd,pierce:s.pierce,slow:s.slow||0,wid:w.id,sz:5,hits:new Set})}
}
// orbit武器伤害检测（火焰环）
function checkOrbitHit(){
  const p=G.P;if(!p||p.hp<=0)return;const t=performance.now()/1000;
  G.weaps.forEach(w=>{if(!w.stats(w.lv).orbit)return;
    const s=w.stats(w.lv),n=s.count;
    for(let i=0;i<n;i++){const a=6.28/n*i+t*2,ox=p.x+Math.cos(a)*s.range,oy=p.y+Math.sin(a)*s.range;
      G.enemies.forEach(e=>{if(e.hp<=0)return;
        if(dist(ox,oy,e.x,e.y)<e.sz+12){
          const key=e.x+','+e.y;
          if(!w._hitCD||!w._hitCD.has(key)){dealDmg(e,s.dmg,w.c,0);
            if(!w._hitCD)w._hitCD=new Set();w._hitCD.add(key);
            setTimeout(()=>w._hitCD&&w._hitCD.delete(key),300)}}})}})}

function activateUlt(){
  if(!G.P.ultReady)return;const p=G.P;p.ultReady=false;p.ultCharge=0;p.ultKills=0;
  p.ultAnim={phase:'ascend',t:0,tx:p.x,ty:p.y};spawnP(p.x,p.y,'#fff',25)
}
function updateUlt(dt){
  const p=G.P;if(!p.ultAnim)return;const u=p.ultAnim;u.t+=dt;
  if(u.phase==='ascend'&&u.t>.6){u.phase='descend';u.t=0}
  else if(u.phase==='descend'&&u.t>.8){
    u.phase='impact';u.t=0;
    G.enemies.forEach(e=>{if(e.hp<=0)return;const d=dist(e.x,e.y,u.tx,u.ty);
      if(d<400){const dmg=100+G.lv*10;e.hp-=dmg;spawnDN(e.x,e.y-e.sz,Math.ceil(dmg),'#fff',true);spawnP(e.x,e.y,'#fff',5);
        if(e.hp<=0){G.kills++;for(let i=0;i<3;i++){const a=Math.random()*6.28;G.pickups.push({x:e.x+Math.cos(a)*Math.random()*20,y:e.y+Math.sin(a)*Math.random()*20,type:'xp',value:Math.ceil(e.xp/3),c:'#74b9ff',sz:5})}
          for(let i=0;i<8;i++)spawnP(e.x,e.y,e.color,4)}}});
    G.enemies=G.enemies.filter(e=>e.hp>0);
    for(let i=0;i<50;i++)spawnP(u.tx,u.ty,Math.random()>.5?'#fff':'#f1c40f',3);
    G.parts.push({x:u.tx,y:u.ty,vx:0,vy:0,life:1.5,max:1.5,a:1,c:'#fff',sz:400,sw:true})
  }else if(u.phase==='impact'&&u.t>1.5){u.phase='done';p.ultAnim=null;p.inv=1}
}

//  伤害计算
// ============================================================
function dealDmg(e,dmg,c,slow){
  let f=dmg;if(G.P.berserk)f*=2.5;
  const critDmg=G.P.critDmg?1+G.P.critDmg:2;
  if(Math.random()<G.P.crit){f*=critDmg;spawnDN(e.x,e.y-e.sz,Math.ceil(f)+'!','#f1c40f')}
  e.hp-=f;e.hitF=1;spawnDN(e.x,e.y-e.sz-5,Math.ceil(f),c);spawnP(e.x,e.y,c,2);
  if(slow>0)e.slowT=2;
  if(e.hp<=0){G.kills++;G.P.ultKills++;
    // 嗜血之刃
    if(G.P.lifesteal)G.P.hp=Math.min(G.P.mhp,G.P.hp+G.P.mhp*G.P.lifesteal);
    const xc=e.boss?10:1;
    for(let i=0;i<xc;i++){const a=Math.random()*6.28,d=Math.random()*20;
      G.pickups.push({x:e.x+Math.cos(a)*d,y:e.y+Math.sin(a)*d,type:'xp',value:Math.ceil(e.xp/xc),c:'#74b9ff',sz:5})}
    if(e.boss){const wi=Math.floor(Math.random()*WDB.length);G.pickups.push({x:e.x+30,y:e.y,type:'wep',wIdx:wi,c:'#f1c40f',sz:8})}
    for(let i=0;i<(e.boss?20:6);i++)spawnP(e.x,e.y,e.color,4)}
}

// ============================================================

function showUpgrade(){
  G.paused=true;const m=document.getElementById('upgrade-menu'),cd=document.getElementById('upCards');
  document.getElementById('upLv').textContent='等级 '+G.lv;
  let opts=[];
  // 武器升级选项（检查是否达到最大等级）
  G.weaps.forEach(w=>{
    const maxL=w.maxLv||8;
    if(w.lv<maxL){opts.push({icon:w.icon,name:w.name,desc:'升级到 Lv.'+(w.lv+1)+' / '+maxL,type:'wup',wi:G.weaps.indexOf(w)})}
    else{opts.push({icon:w.icon,name:w.name,desc:'已达最高等级 Lv.'+maxL,type:'max',wi:G.weaps.indexOf(w)})}
  });
  // 新武器选项
  const avail=WDB.filter(w=>!G.weaps.find(g=>g.id===w.id));
  if(avail.length>0){const nw=avail[Math.floor(Math.random()*avail.length)];opts.push({icon:nw.icon,name:nw.name,desc:nw.desc,type:'nwep',wi:WDB.indexOf(nw)})}
  // 被动道具选项（检查是否达到最大等级）
  if(!G.items)G.items=[];
  ITEMS.forEach(it=>{
    const curLv=G.items[it.id]||0;
    if(curLv<it.maxLv){opts.push({icon:it.icon,name:it.name,desc:it.desc+(curLv>0?' ('+curLv+'/'+it.maxLv+')':' ('+(curLv+1)+'/'+it.maxLv+')'),type:'item',itemId:it.id})}
  });
  // 基础升级选项
  for(let i=0;i<3;i++){const s=UPGRADES[Math.floor(Math.random()*UPGRADES.length)];opts.push({...s})}
  // 过滤已达上限的，混洗取3个
  opts=shuffle(opts.filter(o=>o.type!=='max')).slice(0,3);
  cd.innerHTML='';
  opts.forEach(o=>{const c=document.createElement('div');c.className='ucard';
    const lvLabel=o.type==='wup'?G.weaps[o.wi].lv+'/'+(G.weaps[o.wi].maxLv||8):
                  o.type==='item'?(G.items[o.itemId]||0)+'/'+(ITEMS.find(i=>i.id===o.itemId)?.maxLv||3):'';
    c.innerHTML=`<div class="ui">${o.icon||'\u2B50'}</div><div class="un">${o.name}</div><div class="ud">${o.desc}</div>${lvLabel?'<div class="ul">'+lvLabel+'</div>':''}`;
    c.onclick=()=>{
      if(o.type==='nwep'){const wd=WDB[o.wi];G.weaps.push({...wd,lv:1,cd:0})}
      else if(o.type==='wup'){G.weaps[o.wi].lv++;if(G.weaps[o.wi].lv>=(G.weaps[o.wi].maxLv||8))G.weaps[o.wi].lv=G.weaps[o.wi].maxLv||8}
      else if(o.type==='item'){G.items[o.itemId]=(G.items[o.itemId]||0)+1;const it=ITEMS.find(i=>i.id===o.itemId);if(it&&it.fn)it.fn(G.P)}
      else if(o.fn)o.fn(G.P);
      m.classList.remove('on');G.paused=false};
    cd.appendChild(c)});
  m.classList.add('on')
}

// ============================================================
//  主循环
// ============================================================
let lastT=0;
function loop(ts){if(!G.on)return;const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;
  if(!G.paused)update(dt);render();requestAnimationFrame(loop)}

function update(dt){
  const p=G.P;if(!p)return;G.time+=dt;

  // 移动 - 键盘+摇杆
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my=-1;if(keys['s']||keys['arrowdown'])my=1;
  if(keys['a']||keys['arrowleft'])mx=-1;if(keys['d']||keys['arrowright'])mx=1;
  if(joyActive){mx=joyX;my=joyY}
  if(mx||my){const l=Math.sqrt(mx*mx+my*my);mx/=l;my/=l;
    let spdMul=p.slowT>0?.3:1;if(p.slowT>0)p.slowT-=dt;
    p.x+=mx*p.spd*spdMul;p.y+=my*p.spd*spdMul;
    p.trail.push({x:p.x,y:p.y,a:1});if(p.trail.length>15)p.trail.shift()}
  p.trail.forEach(t=>t.a-=dt*2);p.trail=p.trail.filter(t=>t.a>0);
  if(p.inv>0)p.inv-=dt;if(p.reg>0)p.hp=Math.min(p.mhp,p.hp+p.reg*dt);

  G.cam.x=p.x-W/2;G.cam.y=p.y-H/2;

  // 敌人生成
  G.spawnT+=dt;const si=Math.max(1.5,4-G.time/120);
  if(G.spawnT>=si){G.spawnT=0;spawnWave()}
  G.bossT+=dt;if(G.bossT>=120){G.bossT=0;spawnE('boss');for(let i=0;i<6;i++)spawnE('basic')}
  G.diff=1+G.time/120*.5;

  // 敌人强化
  G.enemies.forEach(e=>{
    if(e.hp<=0||e.boss)return;
    if(!e.enhanced&&G.time>90&&Math.random()<dt*.08){
      e.enhanced=true;e.hp=e.mhp*1.5;e.mhp*=1.5;e.spd*=1.2;e.dmg*=1.3;
      e.color=e.type==='fast'?'#ff6348':e.type==='tank'?'#a855f7':e.type==='shooter'?'#34d399':'#ff6b6b';
      e.sz+=4;spawnP(e.x,e.y,'#f1c40f',10);spawnDN(e.x,e.y-e.sz,'强化!','#f1c40f')
    }
  });

  // 狂暴系统
  if(p.hp/p.mhp<.3&&!p.berserk&&p.berserkCD<=0){p.berserk=true;p.berserkT=8;spawnP(p.x,p.y,'#e74c3c',15)}
  if(p.berserk){p.berserkT-=dt;if(p.berserkT<=0){p.berserk=false;p.berserkCD=30}}
  if(p.berserkCD>0)p.berserkCD-=dt;

  // 大招充能
  p.ultCharge=Math.min(p.ultMax,p.ultKills);
  if(p.ultCharge>=p.ultMax&&!p.ultReady)p.ultReady=true;

  // 更新大招按钮状态
  if(isMobile){const btn=document.getElementById('ultBtn');btn.classList.toggle('ready',!!p.ultReady);btn.textContent=p.ultReady?'处刑!':'大招'}

  // 武器
  G.weaps.forEach(w=>{w.cd-=dt;if(w.cd<=0){
    const s=w.stats(w.lv);let cdMul=1;if(G.P.cdRed)cdMul=Math.max(.2,1-G.P.cdRed);
    w.cd=s.cd*cdMul;fireW(w)}});
  checkOrbitHit();

  // 投射物
  G.proj.forEach(pr=>{
    if(pr.homing&&pr.vx!==0){
      // 追踪最近敌人
      let best=null,bestD=Infinity;
      G.enemies.forEach(e=>{if(e.hp<=0)return;const d=dist(e.x,e.y,pr.x,pr.y);if(d<bestD&&d<200){bestD=d;best=e}});
      if(best){const ta=Math.atan2(best.y-pr.y,best.x-pr.x);const sp=.15;
        const ca=Math.atan2(pr.vy,pr.vx);let diff=ta-ca;while(diff>Math.PI)diff-=6.28;while(diff<-Math.PI)diff+=6.28;
        const na=ca+diff*sp;const spd=Math.sqrt(pr.vx*pr.vx+pr.vy*pr.vy);pr.vx=Math.cos(na)*spd;pr.vy=Math.sin(na)*spd}}
    if(!pr.ground&&!pr.fall){pr.x+=pr.vx;pr.y+=pr.vy}
    if(pr.fall&&pr.vy>0){pr.y+=pr.vy;pr.vy+=.3}
    pr.life-=dt});
  G.proj=G.proj.filter(pr=>pr.life>0);

  // 投射物-敌人碰撞
  G.proj.forEach(pr=>{
    if(pr.ground){G.enemies.forEach(e=>{if(e.hp<=0||pr.hits&&pr.hits.has(e))return;
      if(dist(pr.x,pr.y,e.x,e.y)<e.sz+(pr.aoe||pr.sz)){dealDmg(e,pr.dmg,pr.c,pr.slow);if(pr.hits)pr.hits.add(e)}});return}
    if(pr.beam){G.enemies.forEach(e=>{if(e.hp<=0||pr.hits&&pr.hits.has(e))return;
      if(dist(pr.x,pr.y,e.x,e.y)<e.sz+(pr.aoe||pr.sz)){dealDmg(e,pr.dmg*5,pr.c,0);if(pr.hits)pr.hits.add(e)}});return}
    if(pr.push){G.enemies.forEach(e=>{if(e.hp<=0||pr.hits&&pr.hits.has(e))return;
      if(dist(pr.x,pr.y,e.x,e.y)<e.sz+(pr.sz||30)){
        dealDmg(e,pr.dmg,pr.c,0);if(pr.hits)pr.hits.add(e);
        const px=(e.x-pr.x),py=(e.y-pr.y),pd=Math.sqrt(px*px+py*py)||1;
        e.x+=px/pd*5;e.y+=py/pd*5}});return}
    if(pr.fall){G.enemies.forEach(e=>{if(e.hp<=0||pr.hits&&pr.hits.has(e))return;
      if(dist(pr.x,pr.y,e.x,e.y)<e.sz+(pr.aoe||pr.sz)){dealDmg(e,pr.dmg,pr.c,0);if(pr.hits)pr.hits.add(e);
        for(let i=0;i<12;i++)spawnP(e.x,e.y,pr.c,3)}});return}
    if(pr.chain){
      G.enemies.forEach(e=>{if(e.hp<=0||pr.hits&&pr.hits.has(e))return;
        if(dist(pr.x,pr.y,e.x,e.y)<e.sz+(pr.sz||5)){
          dealDmg(e,pr.dmg,pr.c,0);if(pr.hits)pr.hits.add(e);
          // 弹射到附近敌人
          const nearby=G.enemies.filter(n=>n.hp>0&&!pr.hits.has(n)&&dist(n.x,n.y,e.x,e.y)<150).sort((a,b)=>dist(a.x,a.y,e.x,e.y)-dist(b.x,b.y,e.x,e.y)).slice(0,3);
          nearby.forEach(n=>{dealDmg(n,pr.dmg*.7,pr.c,0);if(pr.hits)pr.hits.add(n);spawnP(n.x,n.y,pr.c,5)});
          for(let i=0;i<8;i++)spawnP(e.x,e.y,pr.c,3);pr.pierce--;if(pr.pierce<=0)pr.life=0}});return}
    G.enemies.forEach(e=>{if(e.hp<=0||pr.hits&&pr.hits.has(e))return;
      if(dist(pr.x,pr.y,e.x,e.y)<e.sz+(pr.sz||5)){dealDmg(e,pr.dmg,pr.c,pr.slow);if(pr.hits)pr.hits.add(e);
        if(pr.spin){for(let i=0;i<3;i++)spawnP(e.x,e.y,pr.c,2)}
        pr.pierce--;if(pr.pierce<=0)pr.life=0}})
  });

  // 敌人移动和攻击
  G.enemies.forEach(e=>{
    if(e.hp<=0)return;
    if(e.slowT>0){e.slowT-=dt;e.slowF=.5}else e.slowF=1;
    if(e.hitF>0)e.hitF-=dt*5;
    const dx=p.x-e.x,dy=p.y-e.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d>0){e.x+=(dx/d)*e.spd*e.slowF;e.y+=(dy/d)*e.spd*e.slowF}
    // 射手
    if(e.shoots){e.shootT-=dt;if(e.shootT<=0){e.shootT=e.shootCd;const a=Math.atan2(dy,dx);
      G.proj.push({x:e.x,y:e.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,dmg:e.dmg*.5,range:400,c:'#ff0',life:2,pierce:1,eProj:true,sz:4})}}
    // 治疗者
    if(e.heals){e.healT-=dt;if(e.healT<=0){e.healT=e.healCd;
      G.enemies.forEach(n=>{if(n.hp<=0||n===e)return;if(dist(n.x,n.y,e.x,e.y)<150){n.hp=Math.min(n.mhp,n.hp+n.mhp*.2);spawnP(n.x,n.y,'#f8a5c2',3)}})}}
    // 召唤师
    if(e.summons){e.summonT-=dt;if(e.summonT<=0){e.summonT=e.summonCd;
      for(let i=0;i<2;i++){const a=Math.random()*6.28;spawnE('bat',e.x+Math.cos(a)*30,e.y+Math.sin(a)*30)}spawnP(e.x,e.y,'#a855f7',8)}}
    // 自爆怪
    if(e.bomber&&d<e.sz+p.sz+5){
      // 爆炸
      G.enemies.forEach(n=>{if(n.hp<=0||n===e)return;if(dist(n.x,n.y,e.x,e.y)<80){dealDmg(n,e.dmg,'#0984e3',0)}});
      if(d<p.sz+e.sz+5&&p.inv<=0){const dmg=e.dmg*(1-p.arm);p.hp-=Math.max(1,dmg);
        if(p.reflect){e.hp-=dmg*p.reflect}p.inv=p.invBonus||.5;
        spawnDN(p.x,p.y-e.sz,Math.ceil(Math.max(1,dmg)),'#e74c3c');spawnP(p.x,p.y,'#e74c3c',5);
        if(p.hp<=0)playerDie()}
      spawnP(e.x,e.y,'#0984e3',15);e.hp=0;
    }
    // 碰撞玩家
    if(d<p.sz+e.sz&&p.inv<=0){
      const dmg=e.dmg*(1-p.arm);p.hp-=Math.max(1,dmg);
      // 荆棘之甲反弹
      if(p.reflect){e.hp-=dmg*p.reflect;spawnDN(e.x,e.y-e.sz,Math.ceil(dmg*p.reflect),'#f39c12')}
      // 冰霜怪冻结
      if(e.freezes){p.slowT=3;p.slowF=.3}
      p.inv=p.invBonus||.5;
      spawnDN(p.x,p.y-e.sz,Math.ceil(Math.max(1,dmg)),'#e74c3c');spawnP(p.x,p.y,'#e74c3c',5);
      if(p.hp<=0)playerDie()}
  });
  G.enemies=G.enemies.filter(e=>e.hp>0);

  // 敌人互相推挤
  for(let i=0;i<G.enemies.length;i++)for(let j=i+1;j<G.enemies.length;j++){
    const a=G.enemies[i],b=G.enemies[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy),md=a.sz+b.sz;
    if(d<md&&d>0){const pu=(md-d)/d*.5;a.x-=dx*pu;a.y-=dy*pu;b.x+=dx*pu;b.y+=dy*pu}}

  // 拾取物
  G.pickups.forEach(pk=>{
    const dx=p.x-pk.x,dy=p.y-pk.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<p.mag){const s=Math.max(2,p.mag*.1);pk.x+=(dx/d)*s;pk.y+=(dy/d)*s}
    if(d<p.sz+pk.sz){if(pk.type==='xp'){G.xp+=pk.value;checkLv()}pk.collected=true;spawnP(pk.x,pk.y,pk.c,3)}});
  G.pickups=G.pickups.filter(pk=>!pk.collected);

  // 粒子
  G.parts.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.life-=dt;pt.a=Math.max(0,pt.life/pt.max);pt.vx*=.95;pt.vy*=.95});
  G.parts=G.parts.filter(pt=>pt.life>0);

  // 伤害数字
  G.dnums.forEach(dn=>{dn.y-=30*dt;dn.life-=dt;dn.a=Math.max(0,dn.life/dn.max)});
  G.dnums=G.dnums.filter(dn=>dn.life>0);

  updateUlt(dt);updateHUD()
}

// ============================================================
//  渲染
// ============================================================
function render(){
  drawBackground();
  X.save();X.translate(-G.cam.x,-G.cam.y);
  const p=G.P;

  // 玩家轨迹
  p.trail.forEach(t=>{X.beginPath();X.arc(t.x,t.y,p.sz*.6*t.a,0,6.28);X.fillStyle=`rgba(52,152,219,${t.a*.3})`;X.fill()});

  // 拾取物
  G.pickups.forEach(pk=>{
    X.beginPath();X.arc(pk.x,pk.y,pk.sz,0,6.28);X.fillStyle=pk.c;X.shadowColor=pk.c;X.shadowBlur=8;X.fill();X.shadowBlur=0;
    if(pk.type==='xp'){X.beginPath();X.arc(pk.x,pk.y,pk.sz+3,0,6.28);X.strokeStyle='rgba(116,185,255,.3)';X.lineWidth=1;X.stroke()}
    if(pk.type==='wep'){X.beginPath();X.arc(pk.x,pk.y,pk.sz+5,0,6.28);X.strokeStyle='rgba(241,196,15,.4)';X.lineWidth=2;X.stroke()}
  });

  // 投射物
  G.proj.forEach(pr=>{
    if(pr.ground){
      const vis=Math.min(1,pr.life);
      X.beginPath();X.arc(pr.x,pr.y,pr.sz*1.5,0,6.28);X.fillStyle=`rgba(0,184,148,${.08*vis})`;X.fill();
      X.beginPath();X.arc(pr.x,pr.y,pr.sz,0,6.28);X.fillStyle=`rgba(0,184,148,${.15*vis})`;X.fill();
      X.beginPath();X.arc(pr.x,pr.y,pr.sz*.5,0,6.28);X.fillStyle=`rgba(0,230,180,${.3*vis})`;X.fill();
      X.beginPath();X.arc(pr.x,pr.y,pr.sz,0,6.28);X.strokeStyle=`rgba(0,230,180,${.4*vis})`;X.lineWidth=2;X.stroke();
      const t=performance.now()/1000;
      for(let i=0;i<3;i++){const bx=pr.x+Math.cos(t*2+i*2.1)*pr.sz*.5,by=pr.y+Math.sin(t*2+i*2.1)*pr.sz*.5;
        X.beginPath();X.arc(bx,by,4,0,6.28);X.fillStyle=`rgba(0,255,200,${.5*vis})`;X.fill()}
      return}
    if(pr.fall){
      // 陨石：大火球带尾迹
      X.beginPath();X.arc(pr.x,pr.y,pr.sz,0,6.28);X.fillStyle=pr.c;X.shadowColor=pr.c;X.shadowBlur=20;X.fill();
      X.beginPath();X.arc(pr.x,pr.y,pr.sz*.6,0,6.28);X.fillStyle='#ff6b6b';X.fill();
      X.beginPath();X.arc(pr.x,pr.y,pr.sz*.3,0,6.28);X.fillStyle='#fff';X.fill();X.shadowBlur=0;
      // 尾迹
      X.fillStyle=`rgba(253,203,110,.2)`;X.beginPath();X.arc(pr.x,pr.y-pr.sz*1.5,pr.sz*.8,0,6.28);X.fill();
      return}
    if(pr.beam){
      // 激光：细长光束
      X.save();X.translate(pr.x,pr.y);
      X.fillStyle=pr.c;X.shadowColor=pr.c;X.shadowBlur=15;
      X.fillRect(-pr.sz*3,-pr.sz/2,pr.sz*6,pr.sz);
      X.fillStyle='#fff';X.fillRect(-pr.sz*2,-pr.sz/4,pr.sz*4,pr.sz/2);
      X.shadowBlur=0;X.restore();return}
    if(pr.push){
      // 龙卷风：旋转气流
      const t=performance.now()/500;
      X.beginPath();X.arc(pr.x,pr.y,pr.sz,0,6.28);X.fillStyle=`rgba(129,236,236,.15)`;X.fill();
      X.strokeStyle=`rgba(129,236,236,.5)`;X.lineWidth=2;X.stroke();
      for(let i=0;i<4;i++){const a=t+i*1.5,r=pr.sz*.6;
        X.beginPath();X.arc(pr.x+Math.cos(a)*r,pr.y+Math.sin(a)*r,3,0,6.28);X.fillStyle=`rgba(129,236,236,.6)`;X.fill()}
      return}
    if(pr.spin){
      // 手里剑：旋转星形
      X.save();X.translate(pr.x,pr.y);X.rotate(pr.rot||0);
      X.fillStyle=pr.c;X.shadowColor=pr.c;X.shadowBlur=8;
      X.beginPath();for(let i=0;i<4;i++){const a=Math.PI/4*i*Math.PI/2;X.lineTo(Math.cos(a)*pr.sz,Math.sin(a)*pr.sz);X.lineTo(Math.cos(a+Math.PI/4)*pr.sz*.4,Math.sin(a+Math.PI/4)*pr.sz*.4)}
      X.closePath();X.fill();X.shadowBlur=0;X.restore();
      if(pr.rot!==undefined)pr.rot+=.3;return}
    if(pr.homing){
      // 飞星：带尾迹
      X.beginPath();X.arc(pr.x,pr.y,pr.sz,0,6.28);X.fillStyle=pr.c;X.shadowColor=pr.c;X.shadowBlur=10;X.fill();
      X.beginPath();X.arc(pr.x-pr.vx*2,pr.y-pr.vy*2,pr.sz*.5,0,6.28);X.fillStyle=pr.c+'88';X.fill();X.shadowBlur=0;
      return}
    if(pr.chain){
      // 闪电链：紫色电弧
      X.beginPath();X.arc(pr.x,pr.y,pr.sz,0,6.28);X.fillStyle=pr.c;X.shadowColor=pr.c;X.shadowBlur=12;X.fill();
      X.beginPath();X.arc(pr.x,pr.y,pr.sz*.4,0,6.28);X.fillStyle='#fff';X.fill();X.shadowBlur=0;
      return}
    // 默认投射物
    X.beginPath();X.arc(pr.x,pr.y,pr.sz||5,0,6.28);X.fillStyle=pr.c;X.shadowColor=pr.c;X.shadowBlur=10;X.fill();X.shadowBlur=0
  });

  // 敌人
  G.enemies.forEach(e=>{
    X.save();
    if(e.enhanced){X.beginPath();X.arc(e.x,e.y,e.sz+8,0,6.28);X.strokeStyle='rgba(241,196,15,.4)';X.lineWidth=2;X.stroke();
      X.beginPath();X.arc(e.x,e.y,e.sz+4,0,6.28);X.strokeStyle='rgba(241,196,15,.2)';X.lineWidth=1;X.stroke()}
    if(e.hitF>0){X.fillStyle='#fff'}else{X.fillStyle=e.color}
    X.shadowColor=e.color;X.shadowBlur=e.boss?20:(e.enhanced?15:8);
    e.draw(X,e);X.shadowBlur=0;
    if(e.boss)drawHP(e.x,e.y-e.sz-15,e.sz*2,5,e.hp,e.mhp);
    if(e.slowT>0){X.beginPath();X.arc(e.x,e.y,e.sz+5,0,6.28);X.strokeStyle='rgba(116,185,255,.5)';X.lineWidth=2;X.stroke()}
    X.restore()
  });

  // 大招动画 - 处刑特效
  if(p.ultAnim){
    const u=p.ultAnim,t=u.t;
    if(u.phase==='ascend'){
      X.beginPath();X.arc(u.tx,u.ty,400,0,6.28);X.fillStyle='rgba(255,0,0,.1)';X.fill();
      X.strokeStyle='rgba(255,0,0,.5)';X.lineWidth=2;X.stroke();
      // 处刑大字
      X.save();X.textAlign='center';X.textBaseline='middle';
      X.font=`bold ${Math.min(72,W/8)}px 'Microsoft YaHei',sans-serif`;
      X.fillStyle='rgba(255,50,50,.9)';X.shadowColor='#ff0000';X.shadowBlur=30;
      X.fillText('处刑',u.tx,u.ty-20);
      X.shadowBlur=10;X.fillStyle='rgba(255,200,200,.5)';
      X.font=`bold ${Math.min(36,W/15)}px 'Microsoft YaHei',sans-serif`;
      X.fillText('处 刑',u.tx,u.ty+40);
      X.restore()
    }else if(u.phase==='descend'){
      const pr=t/.8,ss=400*pr;
      X.beginPath();X.arc(u.tx,u.ty,ss,0,6.28);X.fillStyle=`rgba(255,0,0,${.15*pr})`;X.fill();
      X.strokeStyle=`rgba(255,100,100,${.5*pr})`;X.lineWidth=3;X.stroke();
      // 处刑大字渐隐
      const alpha=Math.max(0,1-pr*.5);
      X.save();X.textAlign='center';X.textBaseline='middle';
      X.font=`bold ${Math.min(72,W/8)}px 'Microsoft YaHei',sans-serif`;
      X.fillStyle=`rgba(255,80,80,${alpha})`;X.shadowColor='#ff0000';X.shadowBlur=40*alpha;
      X.fillText('处刑',u.tx,u.ty);
      X.restore()
    }else if(u.phase==='impact'){
      const fl=Math.max(0,1-t/.3);X.fillStyle=`rgba(255,255,255,${fl*.5})`;X.fillRect(G.cam.x,G.cam.y,W,H);
      // 冲击波处刑文字
      const alpha=Math.max(0,1-t/.5);
      X.save();X.textAlign='center';X.textBaseline='middle';
      X.font=`bold ${Math.min(100,W/6)}px 'Microsoft YaHei',sans-serif`;
      X.fillStyle=`rgba(255,255,255,${alpha})`;X.shadowColor='#f1c40f';X.shadowBlur=50*alpha;
      X.fillText('处刑',u.tx,u.ty);
      X.restore()
    }
  }

  // 玩家 - 精细建模
  if(!(p.ultAnim&&p.ultAnim.phase!=='done')){
    X.save();
    if(p.inv>0&&Math.floor(p.inv*10)%2===0)X.globalAlpha=.5;
    //  Berserk aura
    if(p.berserk){const pu=Math.sin(performance.now()/200)*.3+.7;
      X.beginPath();X.arc(p.x,p.y,p.sz+18,0,6.28);X.fillStyle=`rgba(231,76,60,${pu*.2})`;X.fill();
      X.beginPath();X.arc(p.x,p.y,p.sz+12,0,6.28);X.strokeStyle=`rgba(255,100,100,${pu})`;X.lineWidth=3;X.stroke();
      // 火焰粒子
      for(let i=0;i<5;i++){const a=Math.random()*6.28,r=p.sz+8+Math.random()*12;
        X.beginPath();X.arc(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,1.5,0,6.28);X.fillStyle=`rgba(255,150,50,${.3+Math.random()*.4})`;X.fill()}}
    //  Ultimate ready
    if(p.ultReady){const pu=Math.sin(performance.now()/150)*.4+.6;
      X.beginPath();X.arc(p.x,p.y,p.sz+16,0,6.28);X.strokeStyle=`rgba(241,196,15,${pu*.6})`;X.lineWidth=3;X.stroke();
      X.beginPath();X.arc(p.x,p.y,p.sz+12,0,6.28);X.strokeStyle=`rgba(241,196,15,${pu*.3})`;X.lineWidth=1.5;X.stroke()}
    // 方向
    let dx=0,dy=-1;
    G.enemies.forEach(e=>{if(e.hp<=0)return;const d=dist(e.x,e.y,p.x,p.y);if(d<300){dx=e.x-p.x;dy=e.y-p.y}});
    const da=Math.atan2(dy,dx);
    X.save();X.translate(p.x,p.y);X.rotate(da+Math.PI/2);
    // 外发光
    X.shadowColor=p.berserk?'#e74c3c':'#3498db';X.shadowBlur=20;
    // 披风/外袍
    X.fillStyle=p.berserk?'#c0392b':'#2471a3';
    X.beginPath();X.moveTo(-p.sz*.8,-p.sz*.3);X.lineTo(-p.sz*1.1,p.sz);X.lineTo(p.sz*1.1,p.sz);X.lineTo(p.sz*.8,-p.sz*.3);X.closePath();X.fill();
    X.beginPath();X.moveTo(-p.sz*.6,-p.sz*.3);X.lineTo(-p.sz*.8,p.sz*.8);X.lineTo(p.sz*.8,p.sz*.8);X.lineTo(p.sz*.6,-p.sz*.3);X.closePath();X.fill();
    // 身体（铠甲）
    X.shadowBlur=0;
    X.beginPath();X.arc(0,0,p.sz,0,Math.PI*2);
    const pg=X.createRadialGradient(-p.sz*.3,-p.sz*.3,0,0,0,p.sz);
    if(p.berserk){pg.addColorStop(0,'#ff8a80');pg.addColorStop(.5,'#e74c3c');pg.addColorStop(1,'#922b21')}
    else{pg.addColorStop(0,'#85c1e9');pg.addColorStop(.5,'#3498db');pg.addColorStop(1,'#1a5276')}
    X.fillStyle=pg;X.fill();
    // 胸甲
    X.fillStyle=p.berserk?'rgba(100,0,0,.3)':'rgba(0,40,80,.3)';
    X.beginPath();X.moveTo(-p.sz*.5,-p.sz*.2);X.lineTo(0,p.sz*.1);X.lineTo(p.sz*.5,-p.sz*.2);X.closePath();X.fill();
    // 肩甲
    X.fillStyle=p.berserk?'#b03a2e':'#1f618d';
    X.beginPath();X.arc(-p.sz*.7,-p.sz*.2,p.sz*.3,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(p.sz*.7,-p.sz*.2,p.sz*.3,0,Math.PI*2);X.fill();
    // 头盔
    X.fillStyle=p.berserk?'#922b21':'#154360';
    X.beginPath();X.arc(0,-p.sz*.3,p.sz*.65,Math.PI,0);X.closePath();X.fill();
    X.fillRect(-p.sz*.65,-p.sz*.3,p.sz*1.3,p.sz*.15);
    // 面罩
    X.fillStyle=p.berserk?'#7b241c':'#0e2f44';
    X.fillRect(-p.sz*.45,-p.sz*.4,p.sz*.9,p.sz*.25);
    // 眼睛（发光）
    const eyeC=p.berserk?'#ff6b6b':'#74b9ff';
    X.fillStyle=eyeC;X.shadowColor=eyeC;X.shadowBlur=8;
    X.beginPath();X.arc(-p.sz*.18,-p.sz*.32,3,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(p.sz*.18,-p.sz*.32,3,0,Math.PI*2);X.fill();
    // 高光
    X.shadowBlur=0;X.fillStyle='rgba(255,255,255,.6)';
    X.beginPath();X.arc(-p.sz*.15,-p.sz*.35,1.2,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(p.sz*.21,-p.sz*.35,1.2,0,Math.PI*2);X.fill();
    // 武器指示点
    X.fillStyle=p.berserk?'#ff9999':'#a9d4ff';
    X.beginPath();X.arc(0,-p.sz*.85,3,0,Math.PI*2);X.fill();
    X.restore();
    // 环绕武器
    G.weaps.forEach(w=>{if(w.stats(w.lv).orbit){const s=w.stats(w.lv),n=s.count,t=performance.now()/1000;
      for(let i=0;i<n;i++){const a=6.28/n*i+t*2,ox=p.x+Math.cos(a)*s.range,oy=p.y+Math.sin(a)*s.range;
        X.beginPath();X.arc(ox,oy,7,0,6.28);X.fillStyle=w.c;X.shadowColor=w.c;X.shadowBlur=12;X.fill();X.shadowBlur=0;
        X.beginPath();X.arc(ox-Math.cos(a)*5,oy-Math.sin(a)*5,4,0,6.28);X.fillStyle=w.c+'66';X.fill()}}});
    X.restore()
  }

  // 粒子
  G.parts.forEach(pt=>{X.globalAlpha=pt.a;
    if(pt.sw){const pr=1-pt.life/pt.max,r=pt.sz*pr;X.beginPath();X.arc(pt.x,pt.y,r,0,6.28);X.strokeStyle=`rgba(255,255,255,${pt.a})`;X.lineWidth=4*(1-pr);X.stroke()}
    else{X.fillStyle=pt.c;X.fillRect(pt.x-pt.sz/2,pt.y-pt.sz/2,pt.sz,pt.sz)}});
  X.globalAlpha=1;

  // 伤害数字
  G.dnums.forEach(dn=>{X.globalAlpha=dn.a;X.font=`bold ${dn.cr?15:12}px Arial`;X.fillStyle=dn.c;X.textAlign='center';X.fillText(dn.t,dn.x,dn.y)});
  X.globalAlpha=1;X.restore();
  drawMinimap()
}

// ============================================================
//  地图系统 - 多种随机地图
// ============================================================
const MAP_TYPES=[
  {id:'forest',name:'幽暗森林',bg:'#0a1a0a',accent:'#1a3a1a',deco:'#2d5a2d'},
  {id:'snow',name:'冰雪荒原',bg:'#1a1a2a',accent:'#2a2a3a',deco:'#c8d8e8'},
  {id:'desert',name:'灼热沙漠',bg:'#1a1408',accent:'#2a2010',deco:'#d4a543'},
  {id:'volcano',name:'熔岩深渊',bg:'#1a0a0a',accent:'#2a0a0a',deco:'#e74c3c'},
  {id:'swamp',name:'幽暗沼泽',bg:'#0a1208',accent:'#1a2208',deco:'#4a6a2a'},
  {id:'graveyard',name:'亡灵墓地',bg:'#0a0a12',accent:'#1a1a22',deco:'#5a5a6a'},
  {id:'crystal',name:'水晶洞穴',bg:'#0a0a1a',accent:'#14142a',deco:'#8e44ad'},
  {id:'ruins',name:'远古遗迹',bg:'#120e0a',accent:'#221e14',deco:'#8a7a5a'},
];
let curMap=null;
let mapDecos=[]; // 地图装饰物
let mapParticles=[]; // 地图环境粒子

function genMap(){
  curMap=MAP_TYPES[Math.floor(Math.random()*MAP_TYPES.length)];
  mapDecos=[];mapParticles=[];
  const rng=(a,b)=>a+Math.random()*(b-a);
  // 根据地图类型生成装饰物
  for(let i=0;i<150;i++){
    const x=rng(-4000,4000),y=rng(-4000,4000);
    const d={x,y,sz:rng(5,20),a:Math.random()*6.28,type:Math.floor(Math.random()*3),rot:rng(0,6.28)};
    mapDecos.push(d)
  }
  // 环境粒子
  for(let i=0;i<40;i++){
    const x=rng(-4000,4000),y=rng(-4000,4000);
    mapParticles.push({x,y,vx:rng(-.3,.3),vy:rng(-.3,.3),sz:rng(1,3),a:rng(.1,.3),life:rng(3,8),max:rng(3,8),
      phase:Math.random()*6.28})
  }
  // 预生成草地位置（固定种子避免每帧闪烁）
  window._grassPositions=[];
  for(let i=0;i<300;i++){
    window._grassPositions.push({gx:rng(-4000,4000),gy:rng(-4000,4000),gh:rng(6,12),phase:rng(0,6.28)})
  }
}

function drawBackground(){
  if(!curMap)return;
  const m=curMap;
  // 基础底色
  X.fillStyle=m.bg;X.fillRect(G.cam.x,G.cam.y,W,H);
  X.save();X.translate(-G.cam.x,-G.cam.y);
  // 地图纹理网格
  const g=80,sx=Math.floor(G.cam.x/g)*g,sy=Math.floor(G.cam.y/g)*g;
  // 绘制不同风格的背景纹理
  switch(m.id){
    case 'forest':
      // 森林地面：深绿色草地
      for(let x=sx;x<G.cam.x+W+g;x+=g)for(let y=sy;y<G.cam.y+H+g;y+=g){
        X.fillStyle=((x/g+y/g)%2===0)?'#0d1f0d':'#0a180a';X.fillRect(x,y,g,g)}
      // 小草（用预生成位置）
      X.strokeStyle='rgba(40,80,40,.15)';X.lineWidth=1;
      (window._grassPositions||[]).forEach(gp=>{
        if(gp.gx<G.cam.x-20||gp.gx>G.cam.x+W+20||gp.gy<G.cam.y-20||gp.gy>G.cam.y+H+20)return;
        X.beginPath();X.moveTo(gp.gx,gp.gy);X.lineTo(gp.gx+Math.sin(performance.now()/1000+gp.phase)*3,gp.gy-gp.gh);X.stroke()});
      break;
    case 'snow':
      // 雪地
      for(let x=sx;x<G.cam.x+W+g;x+=g)for(let y=sy;y<G.cam.y+H+g;y+=g){
        X.fillStyle=((x/g+y/g)%2===0)?'#1a1a2e':'#181828';X.fillRect(x,y,g,g);
        // 雪堆
        X.fillStyle='rgba(200,210,230,.05)';X.beginPath();X.arc(x+g/2,y+g/2,g*.4,0,Math.PI*2);X.fill()}
      break;
    case 'desert':
      // 沙地
      for(let x=sx;x<G.cam.x+W+g;x+=g)for(let y=sy;y<G.cam.y+H+g;y+=g){
        X.fillStyle=((x/g+y/g)%2===0)?'#1a1408':'#181206';X.fillRect(x,y,g,g);
        // 沙纹
        X.strokeStyle='rgba(180,140,60,.06)';X.lineWidth=1;
        X.beginPath();X.arc(x+g/2,y+g/2,g*.35,0,Math.PI*2);X.stroke()}
      break;
    case 'volcano':
      // 熔岩地
      for(let x=sx;x<G.cam.x+W+g;x+=g)for(let y=sy;y<G.cam.y+H+g;y+=g){
        X.fillStyle=((x/g+y/g)%2===0)?'#1a0808':'#180606';X.fillRect(x,y,g,g);
        // 熔岩裂缝
        X.strokeStyle=`rgba(231,76,60,${.03+Math.sin(performance.now()/1000+x)*.02})`;X.lineWidth=2;
        X.beginPath();X.moveTo(x,y+g/2);X.quadraticCurveTo(x+g/2,y+g/2+Math.sin(performance.now()/500)*3,x+g,y+g/2);X.stroke()}
      break;
    case 'swamp':
      // 沼泽
      for(let x=sx;x<G.cam.x+W+g;x+=g)for(let y=sy;y<G.cam.y+H+g;y+=g){
        X.fillStyle=((x/g+y/g)%2===0)?'#0a1208':'#080e06';X.fillRect(x,y,g,g);
        // 水洼
        X.fillStyle='rgba(20,60,40,.08)';X.beginPath();X.arc(x+g/2,y+g/2,g*.3,0,Math.PI*2);X.fill()}
      break;
    case 'graveyard':
      // 墓地石板
      for(let x=sx;x<G.cam.x+W+g;x+=g)for(let y=sy;y<G.cam.y+H+g;y+=g){
        X.fillStyle=((x/g+y/g)%2===0)?'#0e0e16':'#0c0c14';X.fillRect(x,y,g,g);
        X.strokeStyle='rgba(80,80,100,.05)';X.lineWidth=1;X.strokeRect(x+2,y+2,g-4,g-4)}
      break;
    case 'crystal':
      // 洞穴地面
      for(let x=sx;x<G.cam.x+W+g;x+=g)for(let y=sy;y<G.cam.y+H+g;y+=g){
        X.fillStyle=((x/g+y/g)%2===0)?'#0e0e1e':'#0c0c1a';X.fillRect(x,y,g,g);
        // 微光
        const gl=.02+Math.sin(performance.now()/800+x*.1+y*.1)*.01;
        X.fillStyle=`rgba(142,68,173,${gl})`;X.fillRect(x,y,g,g)}
      break;
    case 'ruins':
      // 遗迹石板
      for(let x=sx;x<G.cam.x+W+g;x+=g)for(let y=sy;y<G.cam.y+H+g;y+=g){
        X.fillStyle=((x/g+y/g)%2===0)?'#14100c':'#120e0a';X.fillRect(x,y,g,g);
        X.strokeStyle='rgba(100,90,60,.04)';X.lineWidth=1;
        X.beginPath();X.moveTo(x,y);X.lineTo(x+g,y+g);X.stroke();
        X.beginPath();X.moveTo(x+g,y);X.lineTo(x,y+g);X.stroke()}
      break;
  }
  // 绘制装饰物
  mapDecos.forEach(d=>{
    if(d.x<G.cam.x-50||d.x>G.cam.x+W+50||d.y<G.cam.y-50||d.y>G.cam.y+H+50)return;
    switch(m.id){
      case 'forest':drawTree(d);break;
      case 'snow':drawSnowRock(d);break;
      case 'desert':drawCactus(d);break;
      case 'volcano':drawLavaRock(d);break;
      case 'swamp':drawMushroom(d);break;
      case 'graveyard':drawTombstone(d);break;
      case 'crystal':drawCrystal(d);break;
      case 'ruins':drawRuinPillar(d);break;
    }
  });
  // 环境粒子
  const t=performance.now()/1000;
  mapParticles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.phase+=.01;
    const alpha=p.a*(0.5+Math.sin(p.phase)*0.5);
    if(p.x<G.cam.x-10||p.x>G.cam.x+W+10||p.y<G.cam.y-10||p.y>G.cam.y+H+10)return;
    X.fillStyle=m.id==='snow'?`rgba(255,255,255,${alpha})`:
              m.id==='volcano'?`rgba(255,100,50,${alpha*.6})`:
              m.id==='crystal'?`rgba(142,68,173,${alpha})`:
              m.id==='forest'?`rgba(100,255,100,${alpha*.5})`:
              m.id==='graveyard'?`rgba(200,200,200,${alpha*.4})`:
              `rgba(200,200,150,${alpha*.3})`;
    X.beginPath();X.arc(p.x,p.y,p.sz,0,6.28);X.fill()
  });
  X.restore()
}

// 装饰物绘制函数
function drawTree(d){
  X.fillStyle='#1a3a1a';X.beginPath();X.moveTo(d.x,d.y-d.sz*3);X.lineTo(d.x-d.sz*.8,d.y);X.lineTo(d.x+d.sz*.8,d.y);X.closePath();X.fill();
  X.fillStyle='#2a4a2a';X.beginPath();X.moveTo(d.x,d.y-d.sz*2.2);X.lineTo(d.x-d.sz*.6,d.y-d.sz*.5);X.lineTo(d.x+d.sz*.6,d.y-d.sz*.5);X.closePath();X.fill();
  X.fillStyle='#3a2a1a';X.fillRect(d.x-d.sz*.1,d.y,d.sz*.2,d.sz*.5)
}
function drawSnowRock(d){
  X.fillStyle='rgba(180,190,210,.12)';X.beginPath();X.arc(d.x,d.y,d.sz,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(220,230,240,.08)';X.beginPath();X.arc(d.x-d.sz*.2,d.y-d.sz*.2,d.sz*.5,0,Math.PI*2);X.fill()
}
function drawCactus(d){
  X.fillStyle='rgba(80,100,40,.15)';X.fillRect(d.x-d.sz*.15,d.y-d.sz*1.5,d.sz*.3,d.sz*1.5);
  X.fillRect(d.x-d.sz*.6,d.y-d.sz,d.sz*.4,d.sz*.2);
  X.fillRect(d.x+d.sz*.2,d.y-d.sz*.8,d.sz*.4,d.sz*.2)
}
function drawLavaRock(d){
  X.fillStyle='rgba(60,20,20,.2)';X.beginPath();X.moveTo(d.x,d.y-d.sz);X.lineTo(d.x-d.sz,d.y);X.lineTo(d.x+d.sz,d.y);X.closePath();X.fill();
  // 熔岩发光
  const gl=.05+Math.sin(performance.now()/500+d.x)*.03;
  X.fillStyle=`rgba(231,76,60,${gl})`;X.beginPath();X.arc(d.x+d.sz*.3,d.y+d.sz*.2,d.sz*.3,0,Math.PI*2);X.fill()
}
function drawMushroom(d){
  X.fillStyle='rgba(100,80,60,.15)';X.fillRect(d.x-d.sz*.05,d.y-d.sz,d.sz*.1,d.sz);
  X.fillStyle='rgba(80,120,60,.12)';X.beginPath();X.arc(d.x,d.y-d.sz,d.sz*.5,Math.PI,0);X.closePath();X.fill()
}
function drawTombstone(d){
  X.fillStyle='rgba(80,80,100,.12)';X.fillRect(d.x-d.sz*.3,d.y-d.sz*1.2,d.sz*.6,d.sz*1.2);
  X.beginPath();X.arc(d.x,d.y-d.sz*1.2,d.sz*.3,Math.PI,0);X.closePath();X.fill();
  // 十字
  X.strokeStyle='rgba(120,120,140,.1)';X.lineWidth=1;
  X.beginPath();X.moveTo(d.x,d.y-d.sz*1.4);X.lineTo(d.x,d.y-d.sz*.5);X.stroke();
  X.beginPath();X.moveTo(d.x-d.sz*.15,d.y-d.sz);X.lineTo(d.x+d.sz*.15,d.y-d.sz);X.stroke()
}
function drawCrystal(d){
  const gl=.1+Math.sin(performance.now()/300+d.x+d.y)*.05;
  X.fillStyle=`rgba(142,68,173,${gl})`;
  X.beginPath();X.moveTo(d.x,d.y-d.sz*1.5);X.lineTo(d.x-d.sz*.4,d.y);X.lineTo(d.x+d.sz*.4,d.y);X.closePath();X.fill();
  X.fillStyle=`rgba(52,152,219,${gl*.5})`;
  X.beginPath();X.moveTo(d.x+d.sz*.3,d.y-d.sz);X.lineTo(d.x+d.sz*.1,d.y-d.sz*.3);X.lineTo(d.x+d.sz*.5,d.y);X.closePath();X.fill()
}
function drawRuinPillar(d){
  X.fillStyle='rgba(120,110,80,.1)';X.fillRect(d.x-d.sz*.15,d.y-d.sz*2,d.sz*.3,d.sz*2);
  X.fillRect(d.x-d.sz*.3,d.y-d.sz*2.1,d.sz*.6,d.sz*.15);
  X.fillRect(d.x-d.sz*.3,d.y,d.sz*.6,d.sz*.1)
}

function drawMinimap(){
  const mw=110,mh=110,mx=W-mw-10,my=H-mh-10;
  X.fillStyle='rgba(0,0,0,.5)';X.fillRect(mx,my,mw,mh);
  X.strokeStyle='rgba(255,255,255,.08)';X.strokeRect(mx,my,mw,mh);
  const sc=.05;
  G.enemies.forEach(e=>{const ex=mx+mw/2+(e.x-G.P.x)*sc,ey=my+mh/2+(e.y-G.P.y)*sc;
    if(ex>mx&&ex<mx+mw&&ey>my&&ey<my+mh){X.fillStyle=e.boss?'#fff':e.c||e.color;X.fillRect(ex-1,ey-1,e.boss?4:2,e.boss?4:2)}});
  X.fillStyle='#3498db';X.fillRect(mx+mw/2-2,my+mh/2-2,4,4)
}

// ============================================================
//  HUD 更新
// ============================================================
function updateHUD(){
  const p=G.P;if(!p)return;
  document.getElementById('hpBar').style.width=Math.max(0,p.hp/p.mhp*100)+'%';
  document.getElementById('hpTxt').textContent=Math.ceil(Math.max(0,p.hp))+'/'+p.mhp;
  document.getElementById('xpBar').style.width=(G.xp/G.xpNext*100)+'%';
  document.getElementById('xpTxt').textContent=G.xp+'/'+G.xpNext;
  document.getElementById('hudTime').textContent=fmtTime(G.time);
  document.getElementById('hudLv').textContent='Lv.'+G.lv;
  document.getElementById('hudKills').textContent='击杀: '+G.kills;
  document.getElementById('hudWep').textContent='武器: '+G.weaps.map(w=>{
    const maxL=w.maxLv||8;return w.icon+(w.lv>=maxL?'':'.'+w.lv)}).join(' ');
  document.getElementById('hudUlt').textContent='大招: '+p.ultCharge+'/'+p.ultMax+(p.ultReady?' ✓':'');
  document.getElementById('hudUlt').style.color=p.ultReady?'#2ecc71':'#f1c40f';
  const b=document.getElementById('hudBerserk');
  if(p.berserk){b.style.display='block';b.textContent='狂暴: '+Math.ceil(p.berserkT)+'s'}
  else if(p.berserkCD>0){b.style.display='block';b.textContent='狂暴CD: '+Math.ceil(p.berserkCD)+'s'}
  else b.style.display='none';
  // 显示道具
  let itemStr='';
  if(G.items)for(const[id,lv]of Object.entries(G.items)){
    if(lv>0){const it=ITEMS.find(i=>i.id===id);if(it)itemStr+=it.icon+lv+' '}}
  if(itemStr)document.getElementById('hudKills').textContent='击杀: '+G.kills+' | 道具: '+itemStr.trim()
}

// ============================================================
//  游戏流程
// ============================================================
function startGame(){
  document.getElementById('start-screen').style.display='none';
  document.getElementById('hud').style.display='flex';
  resetGame();G.on=true;G.paused=false;lastT=performance.now();requestAnimationFrame(loop)
}
function restartGame(){
  document.getElementById('death-screen').classList.remove('on');
  resetGame();G.on=true;G.paused=false;lastT=performance.now();requestAnimationFrame(loop)
}
function resetGame(){
  G.time=0;G.kills=0;G.lv=1;G.xp=0;G.xpNext=20;
  G.enemies=[];G.proj=[];G.pickups=[];G.parts=[];G.dnums=[];
  G.spawnT=0;G.bossT=0;G.diff=1;G.P=mkPlayer();
  const wi=START_WEPS[Math.floor(Math.random()*START_WEPS.length)];
  G.weaps=[{...WDB[wi],lv:1,cd:0}];G.items={};genMap();updateHUD()
}
function playerDie(){
  G.on=false;
  document.getElementById('dTime').textContent=fmtTime(G.time);
  document.getElementById('dKills').textContent=G.kills;
  document.getElementById('dLv').textContent=G.lv;
  document.getElementById('death-screen').classList.add('on')
}
</script>
