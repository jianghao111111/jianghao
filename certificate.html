<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荣誉证书</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: "Microsoft YaHei", "SimHei", "Noto Sans SC", sans-serif;
        }

        .certificate {
            width: 800px;
            height: 1130px;
            background: #fdfbf5;
            position: relative;
            overflow: hidden;
        }

        /* ===== 外边框 ===== */
        .border-outer {
            position: absolute;
            inset: 10px;
            border: 2.5px solid #6b3a5e;
            pointer-events: none;
            z-index: 10;
        }

        /* ===== 内边框 ===== */
        .border-inner {
            position: absolute;
            inset: 16px;
            border: 1px solid #6b3a5e;
            pointer-events: none;
            opacity: 0.35;
            z-index: 10;
        }

        /* ===== 角落圆弧 ===== */
        .corner {
            position: absolute;
            width: 50px;
            height: 50px;
            pointer-events: none;
            z-index: 11;
        }
        .corner--tl {
            top: 8px; left: 8px;
            border-top: 2.5px solid #6b3a5e;
            border-left: 2.5px solid #6b3a5e;
            border-radius: 18px 0 0 0;
        }
        .corner--tr {
            top: 8px; right: 8px;
            border-top: 2.5px solid #6b3a5e;
            border-right: 2.5px solid #6b3a5e;
            border-radius: 0 18px 0 0;
        }
        .corner--bl {
            bottom: 8px; left: 8px;
            border-bottom: 2.5px solid #6b3a5e;
            border-left: 2.5px solid #6b3a5e;
            border-radius: 0 0 0 18px;
        }
        .corner--br {
            bottom: 8px; right: 8px;
            border-bottom: 2.5px solid #6b3a5e;
            border-right: 2.5px solid #6b3a5e;
            border-radius: 0 0 18px 0;
        }

        /* ===== 内容区域 ===== */
        .content {
            position: relative;
            z-index: 5;
            text-align: center;
            padding-top: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* ===== 装饰线 - 细线中间带小圆点 ===== */
        .ornament {
            width: 300px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ornament svg { width: 100%; height: 100%; }

        /* ===== 证书标题 ===== */
        .cert-title {
            font-size: 80px;
            font-weight: 900;
            color: #5c3a1e;
            letter-spacing: 34px;
            line-height: 1.3;
            margin: 8px 0;
        }

        /* ===== 正文 ===== */
        .cert-body {
            font-size: 22px;
            color: #2a2a2a;
            line-height: 2.2;
            letter-spacing: 4px;
        }

        /* ===== 红色横幅 ===== */
        .red-banner {
            background: #7b2050;
            color: #fff;
            font-size: 22px;
            padding: 10px 0;
            letter-spacing: 6px;
            width: 400px;
            text-align: center;
            margin: 5px 0;
        }

        /* ===== 结语 ===== */
        .cert-footer {
            font-size: 17px;
            color: #2a2a2a;
            letter-spacing: 4px;
            line-height: 1.8;
        }

        /* ===== 底部印章区域 ===== */
        .bottom-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 80px;
        }

        .stamp-year {
            font-size: 15px;
            color: #2a2a2a;
        }

        /* ===== 底部装饰点 ===== */
        .bottom-dots {
            position: absolute;
            bottom: 3px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 14px;
            pointer-events: none;
            z-index: 10;
        }
        .bottom-dots span {
            width: 4px;
            height: 4px;
            background: #6b3a5e;
            border-radius: 50%;
            opacity: 0.25;
        }

        /* ===== 背景底纹 ===== */
        .bg-pattern {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 750px;
            height: 300px;
            opacity: 0.025;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="certificate">
        <!-- 边框 -->
        <div class="border-outer"></div>
        <div class="border-inner"></div>

        <!-- 角落圆弧 -->
        <div class="corner corner--tl"></div>
        <div class="corner corner--tr"></div>
        <div class="corner corner--bl"></div>
        <div class="corner corner--br"></div>

        <!-- 内容 -->
        <div class="content">

            <!-- 上装饰线 -->
            <div class="ornament">
                <svg viewBox="0 0 300 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="0" y1="8" x2="130" y2="8" stroke="#8b7355" stroke-width="1"/>
                    <line x1="170" y1="8" x2="300" y2="8" stroke="#8b7355" stroke-width="1"/>
                    <circle cx="150" cy="8" r="3" fill="#8b7355" opacity="0.5"/>
                </svg>
            </div>

            <!-- 证书标题 -->
            <div class="cert-title">荣誉证书</div>

            <!-- 下装饰线 -->
            <div class="ornament">
                <svg viewBox="0 0 300 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="0" y1="8" x2="130" y2="8" stroke="#8b7355" stroke-width="1"/>
                    <line x1="170" y1="8" x2="300" y2="8" stroke="#8b7355" stroke-width="1"/>
                    <circle cx="150" cy="8" r="3" fill="#8b7355" opacity="0.5"/>
                </svg>
            </div>

            <div style="height: 25px;"></div>

            <!-- 正文 -->
            <div class="cert-body">
                大数据专业 &nbsp;蒋昊&nbsp; 同学
            </div>

            <div style="height: 5px;"></div>

            <div class="cert-body" style="font-size: 19px;">
                被评为
            </div>

            <div style="height: 5px;"></div>

            <!-- 红色横幅 -->
            <div class="red-banner">
                2026年度优秀学生
            </div>

            <div style="height: 10px;"></div>

            <!-- 结语 -->
            <div class="cert-footer">
                特颁此证，以资鼓励。
            </div>

            <!-- 印章区域 -->
            <div class="bottom-area">
                <!-- SVG 印章 - 曲线文字 -->
                <svg width="95" height="95" viewBox="0 0 95 95" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="47.5" cy="47.5" r="44" stroke="#c0392b" stroke-width="2" fill="none" opacity="0.7"/>
                    <!-- 上方弧形文字 -->
                    <path id="topArc" d="M 12 47.5 A 35.5 35.5 0 0 1 83 47.5" fill="none"/>
                    <text font-size="8.5" fill="#c0392b" opacity="0.7" letter-spacing="0.5">
                        <textPath href="#topArc" startOffset="50%" text-anchor="middle">重庆市行知职业</textPath>
                    </text>
                    <!-- 下方弧形文字 -->
                    <path id="botArc" d="M 15 47.5 A 32.5 32.5 0 0 0 80 47.5" fill="none"/>
                    <text font-size="8.5" fill="#c0392b" opacity="0.7" letter-spacing="0.5">
                        <textPath href="#botArc" startOffset="50%" text-anchor="middle">技术学校</textPath>
                    </text>
                    <!-- 五角星 -->
                    <text x="47.5" y="52" text-anchor="middle" font-size="22" fill="#c0392b" opacity="0.7">★</text>
                </svg>
                <span class="stamp-year">2026年</span>
            </div>
        </div>

        <!-- 底部装饰点 -->
        <div class="bottom-dots">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span>
        </div>

        <!-- 背景底纹 - 学校建筑轮廓 -->
        <div class="bg-pattern">
            <svg viewBox="0 0 750 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="120" y="60" width="510" height="170" stroke="#5a3a4e" stroke-width="1.5" fill="none" rx="3"/>
                <polygon points="120,60 375,5 630,60" stroke="#5a3a4e" stroke-width="1.5" fill="none"/>
                <rect x="325" y="150" width="100" height="80" stroke="#5a3a4e" stroke-width="1" fill="none" rx="2"/>
                <rect x="170" y="95" width="55" height="45" stroke="#5a3a4e" stroke-width="0.8" fill="none" rx="1"/>
                <rect x="525" y="95" width="55" height="45" stroke="#5a3a4e" stroke-width="0.8" fill="none" rx="1"/>
                <circle cx="90" cy="170" r="22" stroke="#5a3a4e" stroke-width="0.8" fill="none"/>
                <line x1="90" y1="192" x2="90" y2="230" stroke="#5a3a4e" stroke-width="0.8"/>
                <circle cx="660" cy="170" r="22" stroke="#5a3a4e" stroke-width="0.8" fill="none"/>
                <line x1="660" y1="192" x2="660" y2="230" stroke="#5a3a4e" stroke-width="0.8"/>
                <line x1="150" y1="195" x2="150" y2="230" stroke="#5a3a4e" stroke-width="0.8"/>
                <circle cx="150" cy="190" r="5" stroke="#5a3a4e" stroke-width="0.5" fill="none"/>
                <line x1="600" y1="195" x2="600" y2="230" stroke="#5a3a4e" stroke-width="0.8"/>
                <circle cx="600" cy="190" r="5" stroke="#5a3a4e" stroke-width="0.5" fill="none"/>
                <text x="375" y="270" text-anchor="middle" font-size="18" fill="#5a3a4e" font-family="SimHei" letter-spacing="8">行知学校</text>
            </svg>
        </div>
    </div>
</body>
</html>
